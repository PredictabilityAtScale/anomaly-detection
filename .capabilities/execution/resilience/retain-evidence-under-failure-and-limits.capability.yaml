  verification:
    automated:
      - id: method-and-budget
        description: Retain pre-failure evidence and report a runtime-budget stop.
        command: python -m pytest -q tests/test_analysis.py::test_failure_and_budget
      - id: cli-limits
        description: Enforce byte limits and distinguish execution failure in CLI output
          and exit status.
        command: python -m pytest -q
          tests/test_cli.py::test_size_limit_and_execution_exit
      - id: partial-siblings
        description: Preserve healthy analysis when a sibling dataset fails preparation.
        command: python -m pytest -q
          tests/test_capability_behaviors.py::test_partial_analysis_preserves_healthy_siblings
    manual:
      - Inspect run status, stop_reason, and each target's status before relying
        on a result; confirm limits are presented as cooperative rather than
        hard process timeouts.
