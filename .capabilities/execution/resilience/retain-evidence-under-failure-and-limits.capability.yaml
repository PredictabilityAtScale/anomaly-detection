title: Keep useful evidence when analysis cannot finish
status: implemented
summary: Analysis applies cooperative resource limits and exposes partial or
  failed results without discarding valid earlier or sibling evidence.
intent: Make constrained or failed runs understandable instead of silently
  returning incomplete conclusions.
acceptance:
  - A method failure preserves evidence completed before the failure and reports
    the error.
  - Runtime budgets are checked cooperatively and produce an explicit stop
    reason.
  - CLI byte limits and execution failures produce distinct error exits.
  - A failed dataset or relationship leaves healthy sibling results available
    and marks the overall run partial.
guidance:
  - Default limits are 10,000 source observations per request, 10 MB CLI input,
    and 60 seconds cooperative runtime.
  - Numerical results are deterministic for fixed declared settings; generated
    run IDs and runtimes vary.
planning:
  story_map:
    backbone: Decide how much to rely on a finding
    step: Inspect incomplete execution
    release: Evidence and review policy
    order: 50
