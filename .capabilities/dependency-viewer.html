<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Capability dependency viewer</title>
    <style>
      :root {
        --bg: #f6f8fb;
        --panel: #ffffff;
        --ink: #111827;
        --muted: #64748b;
        --line: #d8e0ea;
        --green: #10b981;
        --blue: #3b82f6;
        --rose: #f43f5e;
        --amber: #f59e0b;
        --link: #78a8ff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at 35% 0%, #ffffff 0%, var(--bg) 62%, #eef2f7 100%);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .app {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 420px;
        min-height: 100vh;
      }
      .main {
        min-width: 0;
        padding: 28px 30px 24px;
      }
      .topbar {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 18px;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.1;
        letter-spacing: 0;
      }
      .subtitle {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 14px;
        font-weight: 560;
      }
      .controls {
        display: flex;
        align-items: end;
        gap: 12px;
        flex-wrap: wrap;
      }
      label {
        display: grid;
        gap: 6px;
        color: #475569;
        font-size: 11px;
        font-weight: 750;
        text-transform: uppercase;
      }
      select, input[type="range"] {
        accent-color: #0ea5e9;
      }
      select {
        width: 230px;
        height: 34px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: rgba(255,255,255,0.92);
        color: var(--ink);
        font: 650 12px Inter, ui-sans-serif, system-ui, sans-serif;
        padding: 0 10px;
      }
      .range-label {
        min-width: 150px;
      }
      .range-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .range-row span {
        min-width: 42px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 650;
        text-align: right;
      }
      .graph-shell {
        position: relative;
        height: calc(100vh - 118px);
        min-height: 620px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255,255,255,0.54);
        box-shadow: 0 18px 52px rgba(15, 23, 42, 0.08);
      }
      svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .legend {
        position: absolute;
        left: 18px;
        bottom: 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px 16px;
        padding: 10px 12px;
        border: 1px solid rgba(148, 163, 184, 0.38);
        border-radius: 8px;
        background: rgba(255,255,255,0.9);
        color: #475569;
        font-size: 12px;
        font-weight: 650;
        backdrop-filter: blur(6px);
      }
      .legend span { display: inline-flex; align-items: center; gap: 6px; }
      .dot {
        width: 12px;
        height: 12px;
        border: 3px solid var(--green);
        border-radius: 999px;
        background: white;
      }
      .dot.partial { border-color: var(--amber); }
      .dot.uncovered { border-color: var(--rose); }
      .dash {
        width: 28px;
        height: 0;
        border-top: 2px dashed var(--muted);
      }
      .link {
        fill: none;
        stroke: var(--link);
        stroke-width: 2;
        stroke-opacity: 0.42;
        marker-end: url(#arrow);
        transition: opacity 140ms ease, stroke-width 140ms ease;
      }
      .link.suggested {
        stroke: var(--muted);
        stroke-dasharray: 8 7;
        stroke-opacity: 0.58;
      }
      .link.active { stroke-width: 3.2; stroke-opacity: 0.92; }
      .link.dimmed { opacity: 0.13; }
      .link.story-map-muted { opacity: 0.12; }
      .node { cursor: pointer; filter: drop-shadow(0 12px 18px rgba(15,23,42,0.12)); }
      .node.dimmed { opacity: 0.2; }
      .node.story-map-muted { opacity: 0.2; }
      .node-halo { fill: transparent; stroke-width: 10; stroke-opacity: 0.15; }
      .node-ring { fill: #fff; stroke-width: 4.6; }
      .node-core { fill: #fff; stroke: rgba(15,23,42,0.08); stroke-width: 1; }
      .full .node-ring, .full .node-halo { stroke: var(--green); }
      .partial .node-ring, .partial .node-halo { stroke: var(--amber); }
      .uncovered .node-ring, .uncovered .node-halo { stroke: var(--rose); }
      .node.selected .node-ring { stroke-width: 7; }
      .node text { text-anchor: middle; pointer-events: none; }
      .label { font-size: 12px; font-weight: 760; fill: #0f172a; }
      .meta { font-size: 9.5px; font-weight: 650; fill: var(--muted); text-transform: uppercase; }
      aside {
        min-width: 0;
        border-left: 1px solid var(--line);
        background: rgba(255,255,255,0.92);
        overflow: auto;
      }
      .panel {
        padding: 26px 24px 34px;
      }
      .panel h2 {
        margin: 0;
        font-size: 23px;
        line-height: 1.2;
        letter-spacing: 0;
      }
      .panel .id {
        margin: 7px 0 0;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      .badges {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin: 16px 0 20px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 25px;
        padding: 4px 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #f8fafc;
        color: #334155;
        font-size: 11px;
        font-weight: 750;
      }
      .badge.gap { border-color: rgba(244,63,94,0.35); color: #be123c; background: #fff1f2; }
      .badge.full { border-color: rgba(16,185,129,0.35); color: #047857; background: #ecfdf5; }
      .badge.partial { border-color: rgba(245,158,11,0.35); color: #b45309; background: #fffbeb; }
      .badge.uncovered { border-color: rgba(244,63,94,0.35); color: #be123c; background: #fff1f2; }
      .section {
        padding: 18px 0;
        border-top: 1px solid var(--line);
      }
      .section.acceptance {
        margin: 18px -12px 0;
        padding: 16px 12px;
        border: 1px solid #bfdbfe;
        border-radius: 8px;
        background: #eff6ff;
      }
      .section h3 {
        margin: 0 0 9px;
        color: #334155;
        font-size: 12px;
        letter-spacing: 0;
        text-transform: uppercase;
      }
      .section p {
        margin: 0;
        color: #475569;
        font-size: 13px;
        line-height: 1.55;
      }
      ul {
        margin: 0;
        padding-left: 18px;
      }
      li {
        margin: 6px 0;
        color: #475569;
        font-size: 13px;
        line-height: 1.45;
        overflow-wrap: anywhere;
      }
      .acceptance-list {
        display: grid;
        gap: 8px;
      }
      .acceptance-item {
        display: grid;
        grid-template-columns: 23px minmax(0, 1fr);
        gap: 9px;
        align-items: start;
        padding: 10px 11px;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
        background: rgba(255,255,255,0.78);
        color: #334155;
        font-size: 13px;
        line-height: 1.45;
      }
      .acceptance-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 23px;
        height: 23px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 850;
        line-height: 1;
      }
      .acceptance-item.covered {
        border-color: rgba(16,185,129,0.36);
        background: #ecfdf5;
      }
      .acceptance-item.covered .acceptance-icon {
        background: #10b981;
        color: #ffffff;
      }
      .acceptance-item.partial {
        border-color: rgba(245,158,11,0.36);
        background: #fffbeb;
      }
      .acceptance-item.partial .acceptance-icon {
        background: #f59e0b;
        color: #ffffff;
      }
      .acceptance-item.gap {
        border-color: rgba(244,63,94,0.36);
        background: #fff1f2;
      }
      .acceptance-item.gap .acceptance-icon {
        background: #f43f5e;
        color: #ffffff;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
      }
      .empty {
        color: #94a3b8;
        font-size: 13px;
      }
      .criterion {
        margin: 8px 0;
        padding: 9px 10px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #f8fafc;
      }
      .criterion strong {
        display: inline-flex;
        margin-bottom: 5px;
        font-size: 11px;
        text-transform: uppercase;
      }
      .review-evidence {
        margin-top: 18px;
        border-top: 1px solid var(--line);
        color: #475569;
      }
      .review-evidence summary {
        cursor: pointer;
        padding: 14px 0;
        color: #334155;
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
      }
      .review-evidence[open] summary {
        padding-bottom: 8px;
      }
      @media (max-width: 980px) {
        .app { grid-template-columns: 1fr; }
        aside { border-left: 0; border-top: 1px solid var(--line); }
        .graph-shell { height: 620px; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <main class="main">
        <div class="topbar">
          <div>
            <h1>Capability dependency viewer</h1>
            <p class="subtitle">Click a capability to inspect intent, references, verification, review status, and relationships.</p>
          </div>
          <div class="controls">
            <label>Scope
              <select id="scope-filter" aria-label="Filter graph by capability folder"></select>
            </label>
            <label>Story Map
              <select id="story-map-filter" aria-label="Filter graph by story map"></select>
            </label>
            <label class="range-label">Zoom

            <label class="range-label">Spacing
              <span class="range-row"><input id="spacing" type="range" min="90" max="170" value="125" /><span id="spacing-value">125%</span></span>
            </label>
          </div>
        </div>
        <div class="graph-shell">

            <g id="viewport"><g id="links"></g><g id="nodes"></g></g>
          </svg>
          <div class="legend">
            <span><i class="dot"></i>Full coverage</span>
            <span><i class="dot partial"></i>Partial coverage</span>
            <span><i class="dot uncovered"></i>Not covered</span>
            <span><i class="dash"></i>Suggested dependency</span>
          </div>
        </div>
      </main>
      <aside><div id="panel" class="panel"></div></aside>
    </div>
