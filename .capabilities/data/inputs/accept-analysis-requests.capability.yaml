title: Bring my metrics into an analysis
status: implemented
summary: Callers can submit ordered numeric values or versioned requests
  containing datasets, settings, context, and declared relationships.
intent: Make the accepted data contract clear before any conclusions are drawn
  from the numbers.
acceptance:
  - Ordered value lists work with separate settings, while schema 1.0 requests
    describe one dataset.
  - Schema 1.1 datasets declare a nonempty entity scope and support explicit
    relationships between named datasets.
  - Unknown settings, unsupported recipes, nonfinite values, booleans, and
    numeric strings are rejected.
  - Published schema 1.0 and 1.1 request and result schemas match the public
    Python contracts.
guidance:
  - Null observations remain unknown unless a schema-1.1 additive-volume policy
    explicitly authorizes confirmed empty collection as zero. Limits apply to
    the request as a whole.
  - Describe current supported behavior; historical plans do not add accepted
    inputs.
planning:
  story_map:
    backbone: Analyze a local series
    step: Supply a numeric series
    release: Basic CLI anomaly detection
    order: 10
