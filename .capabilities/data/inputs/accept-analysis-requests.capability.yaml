      - id: input-forms
        description: Analyze a bare list and validate a canonical request and result.
        command: python -m pytest -q
          tests/test_analysis.py::test_bare_values_with_separate_settings
          tests/test_analysis.py::test_constant_and_schema
      - id: explicit-scope
        description: Reject schema 1.1 datasets without entity scope.
        command: python -m pytest -q
          tests/test_agentic.py::test_schema_11_requires_explicit_entity_scope
      - id: invalid-inputs
        description: Reject unsupported settings and nonnumeric or nonfinite observations.
        command: python -m pytest -q tests/test_analysis.py::test_invalid_config
          tests/test_analysis.py::test_invalid_values
      - id: published-schemas
        description: Compare all four checked-in schemas with their public contracts.
        command: python -m pytest -q tests/test_analysis.py::test_checked_in_schemas
          tests/test_agentic.py::test_v11_checked_in_schemas_exist
    manual:
      - Review the input examples in README.md and confirm they describe the two
        supported schema versions and the four-dataset/four-relationship limit.
