title: Analyze observations in the right time order
status: implemented
summary: Timestamped observations are normalized to UTC, ordered, and checked
  against their declared cadence before analysis.
intent: Compare like periods and make preparation decisions visible to the caller.
acceptance:
  - Calendar datasets provide timestamps and frequency; positional datasets
    provide neither. Explicit schema-1.1 event-index sources retain timestamps
    without a calendar frequency.
  - Local timestamps require a timezone, and ambiguous or nonexistent
    daylight-saving times require an explicit offset.
  - Calendar duplicate timestamps require an aggregation policy; identified
    event-index calls can share original timestamps while duplicate logical IDs
    are rejected and arbitrary tie order supplies no sequence evidence.
  - An as_of cutoff excludes later observations, and cadence is checked as a
    fixed elapsed duration.
guidance:
  - No interpolation or implicit filling, resampling, or unit conversion occurs.
    Schema-1.1 source policies may explicitly authorize confirmed empty additive
    volume as zero.
  - Duplicate null values propagate through aggregation.
  - Stable event identity and trusted sequence are separate caller contracts;
    legacy event inputs without IDs still require unique timestamps.
planning:
  story_map:
    backbone: Analyze a local series
    step: Prepare the comparison
    release: Basic CLI anomaly detection
    order: 20
