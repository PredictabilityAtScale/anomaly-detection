  verification:
    automated:
      - id: source-semantics
        description: Preserve unknown periods and require explicit empty-volume
          authorization.
        command: python -m pytest -q tests/test_sparse.py -k "zero or omitted or grid or
          duplicate or expansion"
      - id: causal-boundaries
        description: Retain real phase, event times, resets and as-of revision eligibility.
        command: python -m pytest -q tests/test_sparse.py -k "phase or gap or reset or
          event or revision or arrival"
      - id: public-interfaces
        description: Preserve useful rules, relationships, views, cases and API parity.
        command: python -m pytest -q tests/test_sparse.py -k "rule or relationship or
          daily or parity"
      - id: progressive-examples
        description: Reproduce the full numbered sequence and sparse worked examples.
        command: python examples/run_demo.py
    manual:
      - Inspect progression figures 14–22 for true gaps, distinguished policy
        zeros, original event time, unavailable checks and caller-owned business
        severity.
