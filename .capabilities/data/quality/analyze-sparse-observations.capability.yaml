title: Assess sparse observations without inventing consumption
status: implemented
summary: Schema-1.1 callers declare coverage and missing-data semantics per
  source, keeping unknown collection distinct from confirmed empty additive
  volume.
intent: Retain useful rule and supported statistical evidence for sparse
  histories while preserving time, provenance, incomplete periods and evidence
  limits.
acceptance:
  - Bounded calendar preparation preserves phase, original values and coverage;
    only an explicit additive-volume empty policy authorizes zero conversion.
  - Frozen eligible training and calibration support point references across
    gaps, while pattern and change comparisons respect gaps and explicit resets.
  - Event-index profiles preserve real event timestamps and reject calendar
    seasonality; unavailable relationship inputs and zero denominators stay
    unavailable.
  - As-of replay respects supplied arrival/revision timestamps and sparse
    multi-resolution views retain useful siblings without inventing complete
    totals.
guidance:
  - Default missingness is unknown. A modeled expectation is never a measurement.
  - Caller business severity, incident state and notifications remain outside
    the engine.
  - Optional event-identity-v1 IDs retain simultaneous distinct calls; only a
    separately asserted trusted sequence permits ordering their measurements.
planning:
  story_map:
    backbone: Monitor while periods are still open
    step: Assess sparse source data
    release: Incomplete-period monitoring
    order: 30
