title: Avoid mistaking unfinished periods for drops
status: implemented
summary: Explicitly incomplete observations are reported as data quality
  evidence and excluded from completed-series analysis.
intent: Prevent an unfinished period from appearing to be an unexplained drop.
acceptance:
  - Schema-1.0 incomplete observations form a trailing suffix; schema-1.1 source
    policies preserve internal and trailing incomplete positions as unavailable.
  - The observed values and timestamps of unfinished periods remain available in
    data quality output.
  - Incomplete source samples are excluded from expectations, calibration, point
    scoring, and completed aggregates.
  - A relationship with an unavailable latest source reports that unavailability
    rather than normal behavior.
guidance:
  - Completeness is declared by the caller; the engine does not infer collection
    completeness.
planning:
  story_map:
    backbone: Monitor while periods are still open
    step: Keep unfinished data visible
    release: Incomplete-period monitoring
    order: 10
