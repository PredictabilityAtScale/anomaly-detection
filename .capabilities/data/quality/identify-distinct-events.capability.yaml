  verification:
    automated:
      - id: identity-and-retries
        description: Retain distinct tied calls and reject duplicate logical identities.
        command: python -m pytest -q tests/test_events.py -k "identity or repeat or
          distinct or reordering"
      - id: honest-order
        description: Keep point/range evidence and require actual declared order for
          tied sequences.
        command: python -m pytest -q tests/test_events.py -k "cohort or ties or trusted
          or reset or lag"
      - id: reproducible-replay
        description: Preserve prefix, as-of, addressed corrections and case revisions.
        command: python -m pytest -q tests/test_events.py -k "prefix or asof or
          correction or revision or reference"
      - id: public-consumers
        description: Validate schemas, Python, CLI, MCP retrieval and bounded response
          growth.
        command: python -m pytest -q tests/test_events.py -k "python_schema or bounded"
    manual:
      - Inspect progression figures 23–24 and the API guide for exact original
        times, layout versus trusted order, retry responsibility and overlapping
        evidence limits.
