title: Inspect distinct events sharing an original timestamp
status: implemented
summary: Callers supply stable logical event IDs so distinct comparable calls at
  one timestamp retain separate values and evidence without inventing
  chronology.
intent: Make real per-call evidence consumable while protecting references,
  replay and pattern interpretation from retry duplication and arbitrary tie
  order.
acceptance:
  - Identified event-index sources retain every distinct event and its original
    time, reject repeated logical IDs and preserve calendar and legacy
    semantics.
  - Without a trusted sequence, whole timestamp cohorts share prior-time point
    references and ties cannot establish change, Nelson or CUSUM continuity.
  - Explicit trusted sequence metadata establishes a validated event order, not
    independence, elapsed cadence or operational authority.
  - Event-specific evidence and case identities survive deterministic replay;
    availability and identified corrections retain as-of provenance and bounded
    results.
guidance:
  - Callers own identity authenticity, retry deduplication, compatible
    populations and any assertion of trustworthy sequence. Sorting an ID
    establishes no cause.
  - Cases and overlapping findings are inspectable numerical evidence;
    applications own incident deduplication, business severity and
    notifications.
