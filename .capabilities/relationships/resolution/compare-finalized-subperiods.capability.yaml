      - src/anomalyzer/agent.py
      - tests/test_sparse.py
      - examples/sparse/unfinished_daily.json
      - docs/sparse-data.md
  verification:
    automated:
      - id: ratio-of-sums
        description: Compute daily ratios from compatible sums and preserve
          missing-child coverage.
        command: python -m pytest -q
          tests/test_sparse.py::test_complete_daily_ratio_divides_sums_and_missing_child_invalidates_only_its_view
      - id: view-policies
        description: Keep native/daily rules separate and preserve case identity on replay.
        command: python -m pytest -q
          tests/test_sparse.py::test_daily_rules_are_not_silently_reused_from_hourly_rules
          tests/test_sparse.py::test_multi_resolution_mcp_drilldown_selects_correct_view_and_replays_case_ids
      - id: view-limits
        description: Report unsupported daily lag semantics without discarding native
          evidence.
        command: python -m pytest -q
          tests/test_sparse.py::test_unsupported_daily_relationship_is_explicit_and_does_not_reinterpret_lag
    manual:
      - Inspect progression chapter 22 and confirm incomplete progress is not
        presented as a completed total or independent corroboration.
