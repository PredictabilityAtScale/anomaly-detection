      - id: other-comparisons
        description: Check declared differences, normalized residuals, and combined
          conditions.
        command: python -m pytest -q
          tests/test_agentic.py::test_remaining_relationship_primitives
      - id: unavailable-values
        description: Keep zero-denominator and missing-source observations unavailable.
        command: python -m pytest -q
          tests/test_agentic.py::test_missing_and_zero_denominator_are_unavailable_not_zero
      - id: adaptive-relationship
        description: Use the adaptive recipe for a declared relationship.
        command: python -m pytest -q
          tests/test_agentic.py::test_adaptive_recipe_runs_for_declared_relationships
    manual:
      - Inspect examples/agentic/conversion.json and distinguish its
        relationship departure from the individual source metrics.
