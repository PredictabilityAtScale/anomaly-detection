title: Find changes in conversion, unit cost, and metric gaps
status: implemented
summary: Explicit relationships produce ratio, difference, normalized-residual,
  and joint-condition series with source-level lineage.
intent: Reveal changes between metrics that individual source values may not expose.
acceptance:
  - Ratios retain the computed value, formula, and original source indexes for
    each sample.
  - Differences, supplied-scale residuals, and all/any threshold conditions
    produce the declared derived values.
  - Missing sources and zero denominators remain unavailable with a reason
    rather than becoming zero.
  - Derived series can be analyzed with the frozen or adaptive single-resolution
    recipe.
guidance:
  - Relationships are caller-supplied declarations, not discovered or causal
    relationships.
  - A difference requires identical declared units; a normalized residual
    requires a positive supplied scale.
  - A joint condition is a declared 0/1 comparison, not statistical proof.
planning:
  story_map:
    backbone: Investigate a change
    step: Define the comparison
    release: Understand a change
    order: 20
