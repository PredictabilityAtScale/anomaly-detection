#
agent:
  # -----------------------------
  # machine managed agent metadata
  # review all capabilities and save evidence: capabilitykit review
  # review this capability and save evidence: capabilitykit review relationships/comparisons/compare-declared-metrics
  # run deterministic review only: capabilitykit review relationships/comparisons/compare-declared-metrics --deterministic-only
  # ask an agent and save review evidence: capabilitykit review relationships/comparisons/compare-declared-metrics --agent codex --arg exec --handoff stdin
  # validate saved agent output without writing: capabilitykit review-result relationships/comparisons/compare-declared-metrics --input review.json
  # -----------------------------
  depends_on:
    - relationships/quality/require-compatible-sources
