      - id: compatible-units
        description: Report a difference unit mismatch without suppressing sibling results.
        command: python -m pytest -q
          tests/test_agentic.py::test_alignment_unit_and_partial_failure_are_specific
      - id: unambiguous-declaration
        description: Reject fields that do not belong to the selected relationship kind.
        command: python -m pytest -q
          tests/test_agentic.py::test_contract_rejects_ambiguous_relationship_fields
      - id: healthy-siblings
        description: Retain a healthy dataset's evidence when another dataset fails
