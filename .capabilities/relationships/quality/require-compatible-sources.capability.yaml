title: Require compatible relationship sources
status: implemented
summary: Declared relationships require exact UTC timestamp alignment, shared
  cadence and entity scope, and compatible declared units.
intent: Prevent comparisons between mismatched populations or periods from
  creating misleading evidence.
acceptance:
  - Related datasets use identical normalized timestamps, the same declared
    cadence, and matching entity metadata.
  - Relationship sources are timestamped and have unique timestamps; implicit
    resampling and duplicate aggregation are not accepted for lineage.
  - Difference relationships require identical declared source units and
    matching output units.
  - An invalid relationship is reported as failed while valid sibling dataset
    results remain available.
guidance:
  - A failed or unavailable relationship does not establish that its metric is
    normal.
  - No implicit timestamp matching, interpolation, unit conversion, or
    zero-filling occurs.
