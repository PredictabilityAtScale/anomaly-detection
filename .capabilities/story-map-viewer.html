<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anomalyzer story map</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --ink: #121826;
        --muted: #65758b;
        --panel: #ffffff;
        --line: #d7e0ea;
        --core: #2563eb;
        --cli: #0891b2;
        --site: #16a34a;
        --plan: #7c3aed;
        --risk: #e11d48;
        --warn: #d97706;
        --soft: #f8fafc;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          linear-gradient(135deg, rgba(37, 99, 235, 0.08), transparent 28%),
          linear-gradient(315deg, rgba(22, 163, 74, 0.08), transparent 26%),
          var(--bg);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .app { min-height: 100vh; }
      header {
        position: sticky;
        top: 0;
        z-index: 5;
        border-bottom: 1px solid rgba(148, 163, 184, 0.35);
        background: rgba(244, 247, 251, 0.88);
        backdrop-filter: blur(16px);
      }
      .header-inner {
        max-width: 1540px;
        margin: 0 auto;
        padding: 22px 28px 18px;
      }
      .title-row {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        align-items: end;
      }
      h1 {
        margin: 0;
        font-size: 30px;
        line-height: 1.08;
        letter-spacing: 0;
      }
      .subtitle {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.45;
        font-weight: 560;
      }
      .summary {
        display: grid;
        grid-template-columns: repeat(5, minmax(84px, 1fr));
        gap: 8px;
        min-width: 520px;
      }
      .metric {
        min-height: 58px;
        padding: 10px 12px;
        border: 1px solid rgba(148, 163, 184, 0.34);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.72);
      }
      .metric strong {
        display: block;
        font-size: 20px;
        line-height: 1;
      }
      .metric span {
        display: block;
        margin-top: 6px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 780;
        text-transform: uppercase;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        margin-top: 18px;
      }
      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      button, input, select {
        font: 700 13px Inter, ui-sans-serif, system-ui, sans-serif;
      }
      button {
        min-height: 34px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: rgba(255,255,255,0.82);
        color: #334155;
        padding: 0 12px;
        cursor: pointer;
      }
      button.active {
        border-color: rgba(37, 99, 235, 0.4);
        background: #dbeafe;
        color: #1d4ed8;
      }
      .filters {
        margin-left: auto;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .view-toggle {
        display: inline-flex;
        gap: 6px;
        padding: 3px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255,255,255,0.72);
      }
      .view-toggle button {
        min-height: 28px;
        border: 0;
        background: transparent;
      }
      .highlight-toggle {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 34px;
        padding: 0 11px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: rgba(255,255,255,0.82);
        color: #334155;
        font: 700 13px Inter, ui-sans-serif, system-ui, sans-serif;
      }
      .highlight-toggle input { width: auto; height: auto; }
      input, select {
        height: 34px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: rgba(255,255,255,0.9);
        color: var(--ink);
        padding: 0 11px;
      }
      input { width: 260px; }
      select { width: 168px; }
      main {
        max-width: 1540px;
        margin: 0 auto;
        padding: 22px 28px 38px;
      }
      .board {
        display: grid;
        gap: 18px;
      }
      .release {
        border: 1px solid rgba(148, 163, 184, 0.38);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.62);
        overflow: hidden;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.07);
      }
      .release-head {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 16px;
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(90deg, rgba(255,255,255,0.88), rgba(248,250,252,0.66));
      }
      .release-title {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .release-title h2 {
        margin: 0;
        font-size: 18px;
        line-height: 1.2;
        letter-spacing: 0;
      }
      .release-chip {
        display: inline-flex;
        align-items: center;
        min-height: 25px;
        padding: 3px 8px;
        border-radius: 999px;
        background: #eef2ff;
        color: #4338ca;
        font-size: 11px;
        font-weight: 840;
        text-transform: uppercase;
      }
      .release-stats {
        display: flex;
        flex-wrap: wrap;
        justify-content: end;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 760;
      }
      .release-outcome {
        grid-column: 1 / -1;
        margin: -4px 0 0;
        color: #334155;
        font-size: 13px;
        line-height: 1.45;
        font-weight: 650;
      }
      .narrative {
        grid-column: 1 / -1;
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }
      .narrative-step,
      .signal {
        display: inline-flex;
        align-items: center;
        min-height: 25px;
        max-width: 100%;
        padding: 3px 8px;
        border-radius: 999px;
        border: 1px solid #cbd5e1;
        background: #ffffff;
        color: #334155;
        font-size: 11px;
        font-weight: 780;
      }
      .narrative-step.action,
      .signal.missing { border-color: #fecdd3; background: #fff1f2; color: #be123c; }
      .narrative-step.ok { border-color: #bbf7d0; background: #ecfdf5; color: #047857; }
      .narrative-step.review,
      .signal.weak { border-color: #bfdbfe; background: #dbeafe; color: #1d4ed8; }
      .narrative-step.planned { border-color: #fde68a; background: #fffbeb; color: #b45309; }
      .signals {
        grid-column: 1 / -1;
        display: none;
        flex-wrap: wrap;
        gap: 7px;
      }
      .show-coverage .signals { display: flex; }
      .steps {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(286px, 1fr));
        gap: 12px;
        padding: 14px;
      }
      .step {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255,255,255,0.82);
        overflow: hidden;
      }
      .show-coverage .step.weak {
        border-color: #93c5fd;
        box-shadow: inset 0 0 0 2px rgba(37, 99, 235, 0.12);
      }
      .step-head {
        min-height: 84px;
        padding: 13px 13px 11px;
        border-bottom: 1px solid #e2e8f0;
        background: var(--soft);
      }
      .backbone {
        color: var(--core);
        font-size: 11px;
        font-weight: 850;
        text-transform: uppercase;
      }
      .step h3 {
        margin: 6px 0 0;
        font-size: 15px;
        line-height: 1.25;
        letter-spacing: 0;
      }
      .cards {
        display: grid;
        gap: 9px;
        padding: 10px;
      }
      .card {
        display: grid;
        gap: 8px;
        padding: 11px;
        border: 1px solid #e2e8f0;
        border-left: 4px solid var(--site);
        border-radius: 7px;
        background: #ffffff;
        cursor: pointer;
        transition: transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease;
      }
      .card:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 26px rgba(15, 23, 42, 0.09);
      }
      .card.action { border-left-color: var(--risk); }
      .card.review { border-left-color: var(--core); }
      .card.planned { border-left-color: var(--warn); }
      .card.coverage-full { border-left-color: var(--site); }
      .card.coverage-partial { border-left-color: var(--warn); }
      .card.coverage-uncovered { border-left-color: var(--risk); }
      .card-title {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: start;
      }
      .card h4 {
        margin: 0;
        font-size: 14px;
        line-height: 1.3;
        letter-spacing: 0;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 22px;
        white-space: nowrap;
        padding: 3px 7px;
        border-radius: 999px;
        background: #ecfdf5;
        color: #047857;
        font-size: 11px;
        font-weight: 850;
      }
      .pill.action { background: #fff1f2; color: #be123c; }
      .pill.review { background: #dbeafe; color: #1d4ed8; }
      .pill.planned { background: #fffbeb; color: #b45309; }
      .pill.coverage-full { background: #ecfdf5; color: #047857; }
      .pill.coverage-partial { background: #fffbeb; color: #b45309; }
      .pill.coverage-uncovered { background: #fff1f2; color: #be123c; }
      .card p {
        margin: 0;
        color: #475569;
        font-size: 12px;
        line-height: 1.45;
      }
      .card-id {
        color: #64748b;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        overflow-wrap: anywhere;
      }
      .planning-note {
        display: none;
        color: #334155;
        font-size: 12px;
        line-height: 1.4;
        font-weight: 650;
      }
      .planning-mode .planning-note { display: block; }
      .planning-mode .card p { color: #1f2937; }
      .unassigned {
        margin-top: 18px;
      }
      .empty {
        padding: 28px;
        border: 1px dashed #cbd5e1;
        border-radius: 8px;
        background: rgba(255,255,255,0.7);
        color: var(--muted);
        text-align: center;
        font-weight: 720;
      }
      dialog {
        width: min(760px, calc(100vw - 32px));
        max-height: calc(100vh - 44px);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0;
        box-shadow: 0 28px 90px rgba(15, 23, 42, 0.24);
      }
      dialog::backdrop { background: rgba(15, 23, 42, 0.34); }
      .detail {
        padding: 22px;
      }
      .detail-top {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        align-items: start;
        border-bottom: 1px solid var(--line);
        padding-bottom: 16px;
      }
      .detail h2 {
        margin: 0;
        font-size: 22px;
        line-height: 1.2;
        letter-spacing: 0;
      }
      .close {
        width: 34px;
        min-width: 34px;
        padding: 0;
        font-size: 18px;
      }
      .detail-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        margin-top: 16px;
      }
      .detail-section {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 13px;
        background: #f8fafc;
      }
      .detail-section.full { grid-column: 1 / -1; }
      .detail-section h3 {
        margin: 0 0 8px;
        color: #334155;
        font-size: 12px;
        letter-spacing: 0;
        text-transform: uppercase;
      }
      .detail-section p, .detail-section li {
        color: #475569;
        font-size: 13px;
        line-height: 1.48;
      }
      .detail-section p { margin: 0; }
      ul { margin: 0; padding-left: 18px; }
      li { margin: 6px 0; overflow-wrap: anywhere; }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
      }
      @media (max-width: 900px) {
        .title-row { display: grid; }
        .summary { min-width: 0; grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .filters { margin-left: 0; width: 100%; }
        input, select { width: 100%; }
        .detail-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div class="header-inner">
          <div class="title-row">
            <div>
              <h1>Anomalyzer story map</h1>
              <p class="subtitle">Plan by release, backbone, and step while keeping delivery status and verification risk visible.</p>
            </div>
            <div class="summary" id="summary"></div>
          </div>
          <div class="toolbar">
            <div class="tabs" id="release-tabs"></div>
            <div class="filters">
              <div class="view-toggle" aria-label="Toggle between outcome-oriented planning view and implementation-health view">
                <button id="planning-view" type="button" class="active">Planning</button>
                <button id="health-view" type="button">Health</button>
              </div>
              <label class="highlight-toggle"><input id="coverage-toggle" type="checkbox" /> Coverage</label>
              <input id="search" type="search" placeholder="Search capabilities" aria-label="Search capabilities" />
              <select id="health-filter" aria-label="Filter by health">
                <option value="">All health states</option>
                <option value="ok">OK</option>
                <option value="review">Needs review</option>
                <option value="action">Needs action</option>
                <option value="planned">Planned</option>
              </select>
            </div>
          </div>
        </div>
      </header>
      <main>
        <div class="board" id="board"></div>
      </main>
      <dialog id="detail-dialog"></dialog>
    </div>

  const wrap = document.createElement("section");
  wrap.className = "detail-section";
  const h3 = document.createElement("h3");
  h3.textContent = title;
  wrap.append(h3, body);
  return wrap;
}
function paragraph(text) {
  const p = document.createElement("p");
  p.textContent = text || "None";
  return p;
}
function list(items, formatter) {
  if (!items || items.length === 0) return paragraph("None");
  const ul = document.createElement("ul");
  for (const item of items) {
    const li = document.createElement("li");
    if (formatter) {
      const value = formatter(item);
      if (value instanceof Node) li.append(value);
      else li.textContent = value;
    } else {
      li.textContent = item;
    }
    ul.append(li);
  }
  return ul;
}
function showDetail(capability) {
  detailDialog.replaceChildren();
  const detail = document.createElement("div");
  detail.className = "detail";
  const top = document.createElement("div");
  top.className = "detail-top";
  const title = document.createElement("div");
  const h2 = document.createElement("h2");
  h2.textContent = capability.title;
  const id = document.createElement("p");
  id.className = "card-id";
  id.textContent = capability.capabilityId;
  title.append(h2, id);
  const close = document.createElement("button");
  close.className = "close";
  close.type = "button";
  close.textContent = "x";
  close.setAttribute("aria-label", "Close details");
  close.addEventListener("click", () => detailDialog.close());
  top.append(title, close);
  const grid = document.createElement("div");
  grid.className = "detail-grid";
  grid.append(section("Status", paragraph(capability.status + " / " + healthLabel(capability.health) + " / " + coverageLabel(capability.coverage))));
  grid.append(section("Story Map", paragraph(capability.storyMap ? capability.storyMap.release + " / " + capability.storyMap.backbone + " / " + capability.storyMap.step : "Unassigned")));
  const summarySection = section("Summary", paragraph(capability.summary));
  summarySection.classList.add("full");
  const intentSection = section("Intent", paragraph(capability.intent));
  intentSection.classList.add("full");
  const findings = section("Next Action", paragraph(capability.nextAction));
  findings.classList.add("full");
  grid.append(summarySection, intentSection, section("Verification Gaps", list(capability.verification.gaps, (gap) => gap.message)), findings);
  detail.append(top, grid);
  detailDialog.append(detail);
  detailDialog.showModal();
}
search.addEventListener("input", () => { searchText = search.value.trim().toLowerCase(); render(); });
healthFilter.addEventListener("change", () => { selectedHealth = healthFilter.value; render(); });
planningView.addEventListener("click", () => { viewMode = "planning"; render(); });
healthView.addEventListener("click", () => { viewMode = "health"; render(); });
coverageToggle.addEventListener("change", () => { showCoverage = coverageToggle.checked; render(); });
detailDialog.addEventListener("click", (event) => {
  if (event.target === detailDialog) detailDialog.close();
});
render();
    </script>
  </body>
</html>
