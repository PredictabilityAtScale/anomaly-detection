      - docs/forecasting.md
      - docs/usagetap-forecast-migration.md
      - docs/forecast-evaluation.json
  verification:
    automated:
      - id: completeness-calendar
        description: Validate statuses, signed values, calendar cadence and DST while
          preserving original bucket positions.
        command: python -m pytest -q -p no:cacheprovider tests/test_forecast.py -k
          "calendar or partial or missing or zero or signed or month or dst"
      - id: fixed-scenario
        description: Verify fixed-fit horizons, learned-trend adjustments, robust policy
          sensitivity and bounded bridge lengths.
        command: python -m pytest -q -p no:cacheprovider tests/test_forecast.py -k
          "projection or horizon or adjustment or robust or bridge"
      - id: causal-history
        description: Changing later observations and appending history cannot change
          earlier qualified expectations or maturity.
        command: python -m pytest -q -p no:cacheprovider tests/test_forecast.py -k
          "contaminate or historical_reference"
      - id: failures-evaluation
        description: Validate explicit unavailable failures, schemas and chronological
          evaluation methodology with anonymous evidence.
        command: python -m pytest -q -p no:cacheprovider tests/test_forecast.py
          tests/test_forecast_evaluation.py
      - id: recent-level-selection
        description: Verify causal smoothing, matching calibration, policy separation,
          short-history ties, explicit models, horizon prefixes and budgets.
        command: python -m pytest -q -p no:cacheprovider tests/test_recent_level.py
    manual:
      - Inspect selection/training windows, outlier policy sensitivity and
        chronological errors alongside the privacy and missing-history limits;
        confirm a scenario is not presented as calibrated accuracy or evidence
        of health.
    gaps:
      - Representative reconciled production histories and reviewed outcomes are
        still needed before recommending Anomalyzer as UsageTap's default
        forecasting method.
      - The 0.8.0 release must run supported-Python and offline Linux Lambda
        artifact checks; local source tests do not certify that deployment.
