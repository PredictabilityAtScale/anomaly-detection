title: Project an observed series as an inspectable scenario
status: implemented
summary: Forecast ordered calendar buckets through a validated public Python and
  JSON contract.
intent: Give callers a fixed-fit scenario while keeping causal historical
  evidence, completeness and limitations explicit.
acceptance:
  - Complete zeros and signed measurements remain observations; partial tails
    preserve time and missing periods return unavailable without filling or
    compression.
  - Forecasts and fitted components use observations only, retain common horizon
    prefixes and apply scenario adjustment only to future learned trend changes.
  - Historical expectations use a frozen prefix selection and never change when
    later observations change or are appended with the same settings.
  - Results expose original indices, fit and inference windows, outlier policy
    effects and separate forecast applicability from anomaly maturity without
    confidence claims.
  - Validated calendar inputs honor local calendar boundaries including DST and
    variable months; invalid, budget and numerical failures never return a
    completed partial forecast.
guidance:
  - Scenarios and fit diagnostics do not establish accuracy or health. Keep the
    UsageTap comparison rollout until reconciled representative chronological
    evidence supports a default change.
#
#
agent:
  # -----------------------------
  # machine managed agent metadata
  # review all capabilities and save evidence: capabilitykit review
  # review this capability and save evidence: capabilitykit review analysis/forecasting/project-observed-series
  # run deterministic review only: capabilitykit review analysis/forecasting/project-observed-series --deterministic-only
  # ask an agent and save review evidence: capabilitykit review analysis/forecasting/project-observed-series --agent codex --arg exec --handoff stdin
  # validate saved agent output without writing: capabilitykit review-result analysis/forecasting/project-observed-series --input review.json
  # -----------------------------
  depends_on:
    - analysis/expectations/model-seasonal-level-and-growth
    - analysis/expectations/select-season-length
    - analysis/expectations/protect-reference-from-extremes
    - analysis/evidence/calibrate-departures
  implementation:
    references:
      - src/anomalyzer/forecast.py
      - src/anomalyzer/forecast_contracts.py
      - src/anomalyzer/__init__.py
      - schemas/forecast-request.schema.json
      - schemas/forecast-result.schema.json
      - tests/test_forecast.py
      - tests/test_forecast_evaluation.py
      - examples/forecasting/fixtures.py
      - examples/forecasting/evaluate.py
      - examples/library/usagetap_forecast.py
      - docs/forecasting.md
      - docs/usagetap-forecast-migration.md
      - docs/forecast-evaluation.json
  verification:
    automated:
      - id: completeness-calendar
        description: Validate statuses, signed values, calendar cadence and DST while
          preserving original bucket positions.
        command: python -m pytest -q -p no:cacheprovider tests/test_forecast.py -k
          "calendar or partial or missing or zero or signed or month or dst"
      - id: fixed-scenario
        description: Verify fixed-fit horizons, learned-trend adjustments, robust policy
          sensitivity and bounded bridge lengths.
        command: python -m pytest -q -p no:cacheprovider tests/test_forecast.py -k
          "projection or horizon or adjustment or robust or bridge"
      - id: causal-history
        description: Changing later observations and appending history cannot change
          earlier qualified expectations or maturity.
        command: python -m pytest -q -p no:cacheprovider tests/test_forecast.py -k
          "contaminate or historical_reference"
      - id: failures-evaluation
        description: Validate explicit unavailable failures, schemas and chronological
          evaluation methodology with anonymous evidence.
        command: python -m pytest -q -p no:cacheprovider tests/test_forecast.py
          tests/test_forecast_evaluation.py
    manual:
      - Inspect selection/training windows, outlier policy sensitivity and
        chronological errors alongside the privacy and missing-history limits;
        confirm a scenario is not presented as calibrated accuracy or evidence
        of health.
    gaps:
      - Representative reconciled production histories and reviewed outcomes are
        still needed before recommending Anomalyzer as UsageTap's default
        forecasting method.
      - The separate 0.6.0 release must run supported-Python and offline Linux
        Lambda artifact checks; local source tests do not certify that
        deployment.
