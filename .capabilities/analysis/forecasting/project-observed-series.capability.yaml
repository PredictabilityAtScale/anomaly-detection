title: Project an observed series as an inspectable scenario
status: implemented
summary: Forecast ordered calendar buckets through a validated public Python and
  JSON contract.
intent: Give callers a fixed-fit scenario while keeping causal historical
  evidence, completeness and limitations explicit.
acceptance:
  - Complete zeros and signed measurements remain observations; partial tails
    preserve time and missing periods return unavailable without filling or
    compression.
  - Forecasts use observations only, retain horizon prefixes and adjust only
    future learned trend changes; explicit recent-level-v1 compares smoothing
    against persistence on bounded chronological multi-step holdouts and retains
    persistence without supported improvement, independently of outlier policy.
  - Historical expectations and matching residual calibration use frozen prefix
    model and baseline selection; later observations cannot change earlier
    targets, with original indices and honest warmup and maturity preserved.
  - Results expose original indices, fit and inference windows, outlier policy
    effects that distinguish forward screening from historical reference
    adjustments, and separate forecast applicability from anomaly maturity
    without confidence claims.
  - Validated calendar inputs honor local calendar boundaries including DST and
    variable months; invalid, budget and numerical failures never return a
    completed partial forecast.
guidance:
  - Scenarios and fit diagnostics do not establish accuracy or health. Keep the
    UsageTap comparison rollout until reconciled representative chronological
    evidence supports a default change.
