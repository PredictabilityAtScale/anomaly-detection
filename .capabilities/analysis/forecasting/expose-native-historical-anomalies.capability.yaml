title: Choose native historical detection independently of forecasting
status: implemented
summary: An opt-in versioned forecast extension exposes native historical point
  and pattern evidence from the same frozen historical analysis.
intent: Let consumers use library statistical qualification while retaining
  their own business materiality, severity and notification preferences.
acceptance:
  - One forecast call reuses its historical analysis and returns typed native
    signed reference, residual, score, triggers, maturity, calibration support,
    availability and detector provenance in original input positions.
  - Frozen-origin earlier point evidence and first-detection pattern snapshots
    survive changed or appended suffixes; provisional evidence cannot trigger,
    and retrospective screening is separate from anomaly qualification.
  - Opt-in defaults preserve existing forecast arrays, signed decomposition,
    horizon prefixes and adjustment semantics; missing gaps and budget failures
    return unavailable without fabricated or partial evidence.
  - Public schemas, a single-call compatibility adapter and migration guidance
    document independent selectors, baseline labels, explicit materiality and
    version negotiation without changing Guard or saved notifications.
guidance:
  - Model exclusions are not incidents. Native scores do not describe residuals
    against a lower-bounded display expectation when that reference differs.
  - A separately approved verified 0.7.0 artifact is required before consumers
    enable the detector; development builds must remain unavailable.
