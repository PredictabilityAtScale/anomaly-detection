        command: python -m pytest -q -p no:cacheprovider
          tests/test_forecast_anomalies.py tests/test_recent_level.py -k "frozen
          or pattern"
      - id: statistical-support-boundaries
        description: Preserve original positions, signed reference semantics,
          calibration maturity, zero, spikes, drops and separate exclusions.
        command: python -m pytest -q -p no:cacheprovider
          tests/test_forecast_anomalies.py -k "warmup or quiet or signed or
          screening or partial"
      - id: opt-in-bridge-safety
        description: Validate schemas, single-analysis reuse, unchanged forecasts, all
          interval caps, deterministic output and explicit failures.
        command: python -m pytest -q -p no:cacheprovider
          tests/test_forecast_anomalies.py -k "bridge or opt_in or invalid or
          models or adapter"
      - id: installed-artifacts
        description: Install built wheel and sdist outside checkout and run public
          Guard, forecast, evidence smoke and the evidence regression suite.
        command: python scripts/verify_distribution.py --python 3.12
      - id: offline-lambda
        description: Execute installed public APIs without network access in the Linux
          x86_64 Python 3.12 Lambda runtime with bridge-sized inputs.
        command: bash scripts/verify_lambda.sh
    manual:
      - Inspect signed versus display references, calibration rebuild cutoffs,
