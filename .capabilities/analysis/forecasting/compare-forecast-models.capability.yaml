title: Compare forecast methods on chronological horizon-matched holdouts
status: implemented
summary: Opt into an explicit forecast model or compare bounded method and
  setting candidates before projecting the supplied series.
intent: Make UsageTap-compatible recent local forecasting available in
  Anomalyzer and choose settings using observable forecast error without
  changing existing anomaly references or default forecasts.
acceptance:
  - An explicit local-trend model reproduces UsageTap Current with outlier
    exclusion disabled, including its recent robust slope, centered seasonal
    offsets, future-only trend adjustment and positional bucket alignment.
  - Explicit naive, seasonal-naive, mean, median, smoothing, damped local trend
    and existing Anomalyzer models expose their settings and separate trend and
    seasonal components without modifying actual observations.
  - Selection evaluates every ranked candidate on the same earlier training
    prefixes and full requested-horizon holdouts, reports losses and failed
    candidates, and deterministically selects the smallest declared objective
    with stable ties.
  - Partial tails never enter fitting or scoring, missing history is
    unavailable, and insufficient validation history or budget exhaustion never
    fabricates a selected or partially evaluated model.
  - Existing forecast and anomaly APIs retain their behavior; selection scores
    do not claim future optimality, calibrated anomaly evidence or uncertainty,
    and selected-model accuracy requires separate outer holdouts.
guidance:
  - Forecast adaptation can absorb incidents. Do not substitute these forward
    models into historical anomaly evidence or recalibrate detector thresholds
    as part of forecast selection.
  - A different requested horizon may select a different model; fixed explicitly
    selected models retain horizon prefixes.
