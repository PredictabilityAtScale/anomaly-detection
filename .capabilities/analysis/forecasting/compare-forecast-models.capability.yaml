#
agent:
  # -----------------------------
  # machine managed agent metadata
  # review all capabilities and save evidence: capabilitykit review
  # review this capability and save evidence: capabilitykit review analysis/forecasting/compare-forecast-models
  # run deterministic review only: capabilitykit review analysis/forecasting/compare-forecast-models --deterministic-only
  # ask an agent and save review evidence: capabilitykit review analysis/forecasting/compare-forecast-models --agent codex --arg exec --handoff stdin
  # validate saved agent output without writing: capabilitykit review-result analysis/forecasting/compare-forecast-models --input review.json
  # -----------------------------
  depends_on:
    - analysis/forecasting/project-observed-series
  implementation:
    references:
      - src/anomalyzer/forecast_selection.py
      - src/anomalyzer/forecast_selection_contracts.py
      - src/anomalyzer/__init__.py
      - tests/test_forecast_selection.py
      - tests/fixtures/usagetap_current.json
      - examples/forecasting/select_models.py
      - examples/library/forecast_smoke.py
      - schemas/forecast-model-request.schema.json
      - schemas/forecast-model-result.schema.json
      - schemas/forecast-selection-request.schema.json
      - schemas/forecast-selection-result.schema.json
      - scripts/export_schemas.py
      - scripts/verify_distribution.py
      - README.md
      - docs/forecasting.md
      - docs/releases/0.9.0.md
      - docs/usagetap-forecast-migration.md
  verification:
    automated:
      - id: original-usagetap-parity
        description: Match independently captured UsageTap predictions and
          signed/clamped trend semantics across four intervals and scenario
          adjustments.
        command: python -m pytest -q -p no:cacheprovider
          tests/test_forecast_selection.py -k "usagetap or components or
          native_family"
      - id: horizon-selection
        description: Enforce prior-only training, identical full-horizon targets,
          objective metrics, stable ties, and independent outer evaluation.
        command: python -m pytest -q -p no:cacheprovider
          tests/test_forecast_selection.py -k "holdout or horizon or losses or
          ties"
      - id: completeness-contracts-budgets
        description: Reject invalid and missing input, preserve partial time and
          calendar alignment, and prevent partial budget/numerical results.
        command: python -m pytest -q -p no:cacheprovider
          tests/test_forecast_selection.py
      - id: existing-forecast-history
        description: Preserve existing default forecast outputs, causal historical
          evidence, native calibration and recent-level policy behavior.
        command: python -m pytest -q -p no:cacheprovider tests/test_forecast.py
          tests/test_forecast_anomalies.py tests/test_recent_level.py
    manual:
      - Review UsageTap parity scope, candidate assumptions and outer holdout
        losses; confirm documentation distinguishes current fitted components
        and selection error from causal anomaly references, ordinary noise,
        detection quality and future accuracy.
    gaps:
      - Production accuracy, incident detection delay and false-alert behavior
        require representative consumer evidence before changing anomaly
        references or recommending a new default.
      - Source verification does not certify publication; release CI must
        qualify supported Python versions and installed/offline Linux artifacts
        before adoption.
