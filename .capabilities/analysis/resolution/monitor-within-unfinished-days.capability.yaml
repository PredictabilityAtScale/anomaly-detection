      - id: unfinished-source
        description: Exclude a marked incomplete source sample from both views.
        command: python -m pytest -q
          tests/test_analysis.py::test_multi_resolution_marks_partial_source_sample_after_full_days
      - id: dividing-cadence
        description: Reject subperiod durations that do not evenly divide a day.
        command: python -m pytest -q
          tests/test_analysis.py::test_multi_resolution_rejects_non_dividing_frequency
    manual:
