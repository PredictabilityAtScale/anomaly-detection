title: See changes before the day is complete
status: implemented
summary: Multi-resolution analysis keeps native finalized subperiod evidence and
  completed fixed 24-hour aggregates, with a separate marker for the unfinished
  day.
intent: Expose changes at the supplied sample cadence before a chart's daily
  total is complete.
acceptance:
  - Callers can select sum, mean, or last aggregation for completed and partial
    periods.
  - Regular timestamped sub-day samples produce distinct native and
    completed-period analysis views.
  - A trailing partial aggregate reports observed progress and links its native
    evidence while remaining outside the completed-period series.
  - An explicitly unfinished source sample is excluded from both analysis views.
  - A source cadence that does not evenly divide 24 hours is rejected.
guidance:
  - Periods are fixed 24-hour windows, not daylight-saving-aware local calendar
    days.
  - Native and daily views share source observations and are correlated.
  - This recipe supports schema 1.0 and does not support reset_points.
planning:
  story_map:
    backbone: Monitor while periods are still open
    step: Compare finalized subperiods
    release: Incomplete-period monitoring
    order: 20
