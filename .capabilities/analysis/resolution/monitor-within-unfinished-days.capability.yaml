  # ask an agent and save review evidence: capabilitykit review analysis/resolution/monitor-within-unfinished-days --agent codex --arg exec --handoff stdin
  # validate saved agent output without writing: capabilitykit review-result analysis/resolution/monitor-within-unfinished-days --input review.json
  # -----------------------------
  depends_on:
