title: Follow evolving growth while exposing unusual values
status: implemented
summary: The adaptive recipe updates each expectation from a bounded window of
  earlier observations while retaining frozen residual calibration.
intent: Follow evolving growth without losing evidence of an isolated unusual value.
acceptance:
  - Each rolling expectation uses only observations before the sample being
    scored.
  - Persistent growth changes can be followed more closely than by the frozen
    default recipe.
  - An isolated extreme value is held out of future model references rather than
    creating a seasonal echo.
  - Conflicting trend choices and slope lookbacks exceeding the adaptive window
    are rejected.
guidance:
  - A persistent third extreme miss in one direction may be admitted to the
    rolling reference; this is not a manual regime reset.
planning:
  story_map:
    backbone: Refine what ordinary behavior means
    step: Follow evolving growth
    release: Trend and seasonal analysis
    order: 40
