      - id: isolated-extreme
        description: Exclude an isolated extreme from later reference estimates.
        command: python -m pytest -q
          tests/test_analysis.py::test_adaptive_recipe_contains_an_isolated_extreme
      - id: bounded-settings
        description: Reject conflicting or unbounded adaptive settings.
        command: python -m pytest -q
