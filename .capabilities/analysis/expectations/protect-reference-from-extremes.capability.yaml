title: Limit how extreme values distort later comparisons
status: implemented
summary: Robust mode limits extreme observations' influence on trend fitting,
  residual calibration, and later seasonal references.
intent: Keep one incident from inflating the reference or appearing again as a
  seasonal echo.
acceptance:
  - Robust seasonal references reduce the influence of an extreme prior matching
    seasonal value.
  - Training and calibration diagnostics identify excluded extreme observations.
  - An extreme evaluated sample remains evidence while its expected value is
    used in future references.
  - Callers can choose include mode to retain raw extreme observations and
    inspect the resulting echo behavior.
guidance:
  - Protection keeps the observed evidence; it does not delete observations or
    certify that a departure was an incident.
planning:
  story_map:
    backbone: Investigate a change
    step: Define the comparison
    release: Understand a change
    order: 20
