title: Use a declared season or infer a positional season
status: implemented
summary: Callers can supply a season length; ordered values without one can use
  conservative season inference with a lag-one fallback.
intent: Make seasonal assumptions explicit and inspectable for data without timestamps.
acceptance:
  - An explicit season length is honored and reported as explicit.
  - A repeating positional series can infer a seasonal lag and report the
    selection window.
  - A positional series without a sufficiently stable candidate falls back to
    lag one and records why.
  - The reserved calibration and evaluation tail does not determine positional
    season selection.
guidance:
  - Candidate discovery uses the input prefix before the reserved tail and
    confirms the candidate in an early window. It is not fully prefix-invariant
    streaming discovery.
  - Supply season_length explicitly when stable streaming season selection is
    required.
