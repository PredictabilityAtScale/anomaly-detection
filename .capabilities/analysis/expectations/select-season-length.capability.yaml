          tests/test_capability_behaviors.py::test_season_inference_excludes_reserved_tail
      - id: cli-inference
        description: Expose the inferred lag and its source for bare JSON values in the CLI.
        command: python -m pytest -q tests/test_cli.py::test_bare_json_values_cli
    manual:
