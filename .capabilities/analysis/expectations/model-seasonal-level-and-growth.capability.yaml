title: Account for ordinary seasonal patterns and growth
status: implemented
summary: The default recipe builds an expectation from earlier matching seasonal
  observations and a training-fitted level, linear, or compound-growth model.
intent: Distinguish unusual departures from ordinary repeating patterns and growth.
acceptance:
  - A supplied season length selects earlier matching seasonal observations for
    the reference.
  - Automatic trend selection represents suitable linear and compound growth
    without flagging ordinary growth as point anomalies; automatic exponential
    selection requires consistent improvement on training-only chronological
    holdouts and otherwise retains a simpler trend.
  - The fitted trend remains frozen after training within a regime; later
    changed values do not rewrite that fit.
  - Callers can explicitly select none, linear, or exponential trend, and
    unsupported trend modes are rejected.
guidance:
  - Expectations support scoring; they are not a standalone forecasting API.
  - Chronological confirmation is bounded to the fitting suffix and does not
    guarantee that a frozen model stays appropriate after a later regime change.
planning:
  story_map:
    backbone: Refine what ordinary behavior means
    step: Account for growth and seasonality
    release: Trend and seasonal analysis
    order: 10
