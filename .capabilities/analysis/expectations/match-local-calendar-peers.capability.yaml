title: Match observations from comparable local calendar dates
status: implemented
summary: Schema 1.1 callers can opt into an expectation based on supported
  earlier dates in the source's declared timezone.
intent: Compare native buckets with earlier observations from comparable local
  periods and preserve the distinction between departures and confirmed
  incidents.
acceptance:
  - Calendar references use only complete earlier buckets available at the
    scoring cutoff within the declared segment, elapsed lookback, and recency
    guard.
  - The versioned calendar ladder selects four supported dates with
    distinct-week support and reports each attempted tier and the configured
    fallback.
  - Each tier and target day group learns its own chronological residual
    calibration within a segment, with provisional evidence unable to trigger
    and opt-in calibrated broader fallback while the preferred key learns.
  - UTC bucket order and local DST evidence are preserved, unknown and
    incomplete buckets stay unscored, and resets and gap policies bound
    reference history.
  - Callers can inspect selected peers, availability and calibration support,
    and the limits of drawing incident conclusions from residual evidence.
guidance:
  - Calendar matching is opt-in. Date stamps alone do not establish calendar
    repeatability or justify changing detector defaults.
  - The recency guard delays contamination by a sustained departure.
  - Native bucket matching leaves local-period aggregation and population
    testing to their separate contracts.
