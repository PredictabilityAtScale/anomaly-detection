      - src/anomalyzer/mcp_views.py
      - tests/test_calendar_baseline.py
      - docs/calendar-reference.md
      - examples/comparison/CALENDAR-REFERENCE.md
  verification:
    automated:
      - id: supported-peers
        description: Check distinct date and week support, fallback, guard endpoints and
          fixed-lag arithmetic.
        command: uv run python -m pytest -q tests/test_calendar_baseline.py -k
          "stages_distinct or fixed_lag or sustained_departure"
      - id: causal-calibration
        description: Verify independent frozen calibration and replay across future
          arrivals, revisions and reset boundaries.
        command: uv run python -m pytest -q tests/test_calendar_baseline.py -k
          "calibration_is_keyed or prefix_with_future or calibrated_fallback or
          fallback_and_ranges_relearn"
      - id: calendar-coverage
        description: Check clock windows, DST, unknown collection, authorized zero and
          gap restarts.
        command: uv run python -m pytest -q tests/test_calendar_baseline.py -k "dst or
          missing_incomplete"
      - id: public-evidence
        description: Verify Python, CLI, schema and MCP parity and visible request
          budget failures.
        command: uv run python -m pytest -q --basetemp .tmp-calendar-capability
          tests/test_calendar_baseline.py -k "public_entry or mcp_finding or
          resource_failure"
    manual:
      - Inspect an ordinary weekend, a weekend incident and a DST abstention
        together. Confirm comparable date support, a calibrated departure with
        unresolved incident and business impact, and an explicit DST exclusion.
    gaps:
      - Representative labeled operational histories are needed before any
        decision to change detector defaults.
