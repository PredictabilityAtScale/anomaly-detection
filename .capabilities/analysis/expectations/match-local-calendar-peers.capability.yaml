  # review all capabilities and save evidence: capabilitykit review
  # review this capability and save evidence: capabilitykit review analysis/expectations/match-local-calendar-peers
  # run deterministic review only: capabilitykit review analysis/expectations/match-local-calendar-peers --deterministic-only
  # ask an agent and save review evidence: capabilitykit review analysis/expectations/match-local-calendar-peers --agent codex --arg exec --handoff stdin
  # validate saved agent output without writing: capabilitykit review-result analysis/expectations/match-local-calendar-peers --input review.json
  # -----------------------------
  depends_on:
    - data/inputs/accept-analysis-requests
    - data/quality/analyze-sparse-observations
    - analysis/expectations/reset-declared-regimes
    - analysis/expectations/protect-reference-from-extremes
    - analysis/evidence/calibrate-departures
    - analysis/detection/identify-residual-patterns
  implementation:
    references:
      - src/anomalyzer/contracts.py
      - src/anomalyzer/calendar_baseline.py
      - src/anomalyzer/calendar_scoring.py
      - src/anomalyzer/sparse.py
