  # ask an agent and save review evidence: capabilitykit review analysis/expectations/reset-declared-regimes --agent codex --arg exec --handoff stdin
  # validate saved agent output without writing: capabilitykit review-result analysis/expectations/reset-declared-regimes --input review.json
