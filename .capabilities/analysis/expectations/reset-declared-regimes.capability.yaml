title: Compare against a new baseline after a known change
status: implemented
summary: Caller-supplied reset points divide a single-resolution series into
  independently trained and calibrated regimes.
intent: Recognize known discontinuities without forcing the previous regime to
  explain the new one.
acceptance:
  - Integer positions and exact observed dates or timestamps can identify reset
    boundaries.
  - Each new regime rebuilds its reference, trend, and calibration without
    crossing earlier boundaries.
  - Repeated, out-of-range, or unmatched reset points are rejected.
  - CLI reset options produce the same resolved positions and suppress
    departures explained by the declared boundaries.
guidance:
  - Reset points are explicit caller decisions. Known-event notes and
    review-state fields do not rebuild regimes.
  - Multi-resolution analysis does not support reset_points.
planning:
  story_map:
    backbone: Investigate a change
    step: Define the comparison
    release: Understand a change
    order: 20
