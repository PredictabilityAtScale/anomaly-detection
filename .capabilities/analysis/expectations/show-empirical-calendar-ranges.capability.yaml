title: Inspect empirical expected ranges for calendar observations
status: implemented
summary: Calendar callers can request expected ranges calibrated on earlier
  absolute prediction errors and inspect their support and historical cutoff.
intent: Make the uncertainty around calendar expectations inspectable and
  measurable on later data without changing anomaly alert criteria.
acceptance:
  - Ranges are opt-in for calendar references and retain a separate calibration
    per segment, tier and target day group.
  - Calibration retains unscreened earlier absolute errors and freezes only
    after sample, date, week and finite-sample rank requirements pass.
  - A range becomes available after its calibration cutoff, and insufficient
    history remains explicit without borrowing support across resets.
  - Requesting ranges leaves point triggers, observations and residual patterns
    unchanged and describes coverage as an empirical target rather than a
    guarantee.
guidance:
  - Assess later normal coverage, width and unavailable periods together.
  - Serial dependence, changing references and regimes can alter future coverage.
