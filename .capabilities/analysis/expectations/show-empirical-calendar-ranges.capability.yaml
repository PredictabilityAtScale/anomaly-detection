#
agent:
  # -----------------------------
  # machine managed agent metadata
  # review all capabilities and save evidence: capabilitykit review
  # review this capability and save evidence: capabilitykit review analysis/expectations/show-empirical-calendar-ranges
  # run deterministic review only: capabilitykit review analysis/expectations/show-empirical-calendar-ranges --deterministic-only
  # ask an agent and save review evidence: capabilitykit review analysis/expectations/show-empirical-calendar-ranges --agent codex --arg exec --handoff stdin
  # validate saved agent output without writing: capabilitykit review-result analysis/expectations/show-empirical-calendar-ranges --input review.json
  # -----------------------------
  depends_on:
    - analysis/expectations/match-local-calendar-peers
  implementation:
    references:
      - src/anomalyzer/contracts.py
      - src/anomalyzer/expected_ranges.py
      - src/anomalyzer/calendar_scoring.py
      - tests/test_expected_ranges.py
      - tests/test_calendar_baseline.py
      - docs/calendar-reference.md
      - examples/comparison/benchmark_calendar_improvements.py
  verification:
    automated:
      - id: finite-rank
        description: Check rank support, unscreened extreme errors and frozen bounds.
        command: uv run python -m pytest -q tests/test_expected_ranges.py
      - id: historical-cutoff
        description: Check range cutoffs and invariant decisions after later arrivals.
        command: uv run python -m pytest -q tests/test_calendar_baseline.py -k
          calibrated_fallback
      - id: unchanged-findings
        description: Compare point evidence, observations and patterns with ranges enabled.
        command: uv run python -m pytest -q tests/test_calendar_baseline.py -k
          expected_ranges_do_not_change
      - id: reset-and-options
        description: Require fresh range support after reset and reject incompatible
          options.
        command: uv run python -m pytest -q tests/test_calendar_baseline.py -k
          fallback_and_ranges_relearn
    manual:
      - Inspect later normal coverage and range widths alongside unscored
        periods in a paired replay; confirm the coverage target is not presented
        as an incident probability or guaranteed future coverage.
    gaps:
      - Representative operational histories are needed to establish useful
        coverage targets and widths under dependence and changing regimes.
  review:
    depth: partial
    source: deterministic-assessment
    gaps:
