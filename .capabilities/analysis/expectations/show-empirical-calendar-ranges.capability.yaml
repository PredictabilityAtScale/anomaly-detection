        the cited evidence. If it is correct, save agent.review evidence or make
        the criterion/reference wording more explicit.
      - Requesting ranges leaves point triggers, observations and residual
        patterns unchanged and describes coverage as an empirical target rather
        than a guarantee. Review the cited evidence. If it is correct, save
        agent.review evidence or make the criterion/reference wording more
        explicit.
