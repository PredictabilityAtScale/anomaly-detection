  implementation:
    references:
      - src/anomalyzer/rate_contracts.py
      - src/anomalyzer/rates.py
      - src/anomalyzer/rate_views.py
      - src/anomalyzer/mcp.py
      - src/anomalyzer/cli.py
      - tests/test_rates.py
      - docs/rates.md
      - examples/comparison/benchmark_rates.py
  verification:
    automated:
      - id: exact-count-inference
        description: Compare exact p-values against independent integer tables and
          boundary cases.
        command: uv run python -m pytest -q tests/test_rates.py -k "exact_test or
          published_fisher or large_and_unbalanced or zero_all"
      - id: sparse-and-unavailable
        description: Check count validation, sparse uncertainty, unavailable exposure
          and separate rate rules.
        command: uv run python -m pytest -q tests/test_rates.py -k "percentage_change or
          invalid_bounded or no_exposure or finite_reference or pooled_rate or
          testing_family"
      - id: causal-replay
        description: Check frozen references, fixed testing families, prefix invariance
          and incomplete windows.
        command: uv run python -m pytest -q tests/test_rates.py -k "monitor or
          budget_failure"
      - id: public-agent-evidence
        description: Check schemas and Python/CLI parity plus compact contextual MCP
          summaries and source drilldown.
        command: uv run python -m pytest -q tests/test_rates.py -k "public_python or
          context_is_preserved"
    manual:
      - Inspect sparse and busy comparisons with the same percentage change,
        drill into source counts, and confirm uncertainty, model assumptions and
        the distinction between a numerical event and an alert decision are
        clear.
    gaps:
      - Representative customer replay is needed for dependent trials and
        changing traffic mix; exact binomial inference does not correct
        clustering or overdispersion.
