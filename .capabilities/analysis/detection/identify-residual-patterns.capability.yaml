title: Spot sustained shifts and changing patterns
status: implemented
summary: Residual rules identify location shifts, trends, oscillation, mixture
  patterns, and short-term variation beyond isolated point departures.
intent: Find accumulating changes and explain which numerical pattern was detected.
acceptance:
  - Nelson location rules and CUSUM can identify a sustained residual location
    shift without any point-threshold crossing.
  - CUSUM reports the first detection position, direction, accumulated score,
    and configured threshold.
  - Trend, oscillation, and mixture findings retain their specific pattern
    meanings.
  - Moving-range findings identify variation changes separately from location
    changes.
guidance:
  - Pattern findings may overlap and are not independent confirmations.
  - A residual location shift does not establish a change in the full
    distribution.
planning:
  story_map:
    backbone: Refine what ordinary behavior means
    step: Find sustained residual changes
    release: Trend and seasonal analysis
    order: 60
