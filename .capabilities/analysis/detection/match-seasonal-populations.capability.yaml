  verification:
    automated:
      - id: explicit-populations
        description: Select the declared earlier daily or weekday populations and
          preserve the causal reference under reordered or future input.
        command: python -m pytest -q tests/test_seasonal_distributions.py -k "matching
          or weekday or future"
      - id: calendar-boundaries
        description: Match partial progress, follow local 8am across DST, and reject or
          skip ambiguous, nonexistent and offset-transition windows.
        command: python -m pytest -q tests/test_seasonal_distributions.py -k "partial or
          dst or ambiguous"
      - id: support-and-fallback
        description: Require distinct dates, preserve missing observations and bound
          nearest-window selection with support-only opt-in fallback.
        command: python -m pytest -q tests/test_seasonal_distributions.py -k "distinct
          or fallback or nearest or unknowns"
      - id: numerical-and-interface-contracts
        description: Preserve report-level quantities, repeated-testing allocation,
          non-triggering budget failures and Python/CLI/MCP/schema parity.
        command: python -m pytest -q tests/test_seasonal_distributions.py -k
          "categorical or budget or api_cli or invalid"
      - id: documented-example
        description: The checked-in normal scheduled batch stays quiet under the
          declared matching policy.
        command: python examples/run_distribution_demo.py
    manual:
      - Compare README chapter 27 and its PNG with the real-engine fixture,
        selected IDs/window boundaries and the broad-history comparison; inspect
