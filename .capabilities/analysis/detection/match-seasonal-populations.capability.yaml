title: Compare behavior with explicitly matched prior time windows
status: implemented
summary: Select earlier populations using a declared timezone and daily or
  weekday clock window before running the existing distribution comparison.
intent: Keep expected scheduled workload changes from being confused with
  behavioral distribution changes while exposing exactly which history supports
  the comparison.
acceptance:
  - Explicit daily, same-weekday or weekday/weekend matching selects only
    earlier local-calendar windows and records selected and excluded
    observations.
  - A partial current window is compared with the same local-clock progress in
    prior windows, with explicit handling of timezone and daylight-saving
    boundaries.
  - Minimum measured support across distinct prior windows gates inference; any
    broader daily fallback is declared in advance and visibly reported.
  - Selected numeric or categorical events reuse the existing distribution tests
    and retain the caller's repeated-comparison allocation without creating a
    fresh testing budget.
  - Reference selection is deterministic and inspectable, with no automatic
    season discovery, inferred business comparability or claim that seasonal
    matching removes within-batch dependence.
guidance:
  - Keep rate and overall workload-mix monitoring separate so matching does not
    hide a missing, moved or enlarged scheduled batch.
  - The caller owns collection completeness, available snapshots, workload scope
    and independent sampling assumptions; this feature does not add block
    resampling.
