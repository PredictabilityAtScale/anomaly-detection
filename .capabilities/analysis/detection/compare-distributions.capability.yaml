  # machine managed agent metadata
  # review all capabilities and save evidence: capabilitykit review
  # review this capability and save evidence: capabilitykit review analysis/detection/compare-distributions
  # run deterministic review only: capabilitykit review analysis/detection/compare-distributions --deterministic-only
  # ask an agent and save review evidence: capabilitykit review analysis/detection/compare-distributions --agent codex --arg exec --handoff stdin
  # validate saved agent output without writing: capabilitykit review-result analysis/detection/compare-distributions --input review.json
  # -----------------------------
  implementation:
    references:
      - src/anomalyzer/distribution_contracts.py
      - src/anomalyzer/distributions.py
      - src/anomalyzer/__init__.py
      - src/anomalyzer/cli.py
      - src/anomalyzer/mcp.py
      - tests/test_distributions.py
      - examples/run_distribution_demo.py
      - examples/render_readme_progression.py
      - docs/distribution-detection.md
      - README.md
  verification:
    automated:
      - id: numeric-populations
        description: Exact tied-value label permutations, stable zero-heavy mixtures and
          mean-preserving changes without extreme points.
        command: python -m pytest -q tests/test_distributions.py -k "numeric_exact or
          same_mean or stable_zero"
      - id: categorical-populations
        description: Whole-composition changes and report-level weighted permutations
          retain event support rather than inventing independent units.
        command: python -m pytest -q tests/test_distributions.py -k "categorical or
          weighted or quantities"
      - id: causal-testing-budget
        description: Frozen causal replay preserves identities and gaps, exposes
          horizons and controls a predeclared family over exhaustive null
          allocations.
        command: python -m pytest -q tests/test_distributions.py -k "monitor or horizon
          or unknowns or family_budget or runtime"
      - id: interface-contracts
        description: CLI, MCP and public Python results agree with generated schemas and
          explicit evidence gates.
        command: python -m pytest -q tests/test_distributions.py -k "cli or schemas or
          invalid or assumptions or multiple_comparison"
      - id: graphical-examples
        description: Checked-in numeric, categorical, weighted-report and causal-monitor
          fixtures produce the documented real-engine evidence.
        command: python examples/run_distribution_demo.py
    manual:
      - Inspect README chapters 25–26 against their actual request/results and
        PNGs; verify unchanged means, source support, first detection,
        weighted-unit limits and the distinction between statistical evidence
        and business impact.
    gaps:
      - Real-world detection delay, false-finding burden and clustered-call
        validity require representative caller-owned replay; synthetic examples
        do not establish production effectiveness.
