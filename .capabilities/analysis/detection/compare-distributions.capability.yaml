title: Detect changes across populations of observations
status: implemented
summary: Compare numeric distributions and categorical compositions using
  explicit, disjoint populations, including ties and ordinary zero values.
intent: Find behavioral changes in spread, tails, zero frequency or category
  composition even when average usage stays steady and no individual reading is
  extreme.
acceptance:
  - Numeric comparisons use a tie-aware two-sample empirical distribution test
    and report effect size, population support and source identities.
  - Categorical comparisons assess the whole composition and explain changed
    shares without treating consumed quantities as independent observations.
  - Causal monitoring freezes an earlier reference, compares bounded recent
    windows and accounts for all planned looks and window sizes in its testing
    budget.
  - Unknown observations and untrusted tied timestamps cannot silently establish
    sequence continuity, and insufficient or unfinished evidence cannot
    establish normality.
  - Results separate statistical evidence, practical effect thresholds and
    business impact, with inspectable assumptions and reproducible calculations.
guidance:
  - The caller owns comparable populations, independent sampling assumptions and
    the testing budget across monitors, resets and deployments.
  - A distribution change does not establish abuse, cause or permission to act.
