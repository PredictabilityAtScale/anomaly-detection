title: Find unusual spikes and drops
status: implemented
summary: Calibrated point-threshold crossings become inspectable observations,
  with adjacent crossings grouped into episodes.
intent: Locate unusual values and keep isolated events distinct from sustained runs.
acceptance:
  - A sufficiently extreme calibrated sample records a point trigger and the
    expectation it departed from.
  - Repeated runs of the same fixed request preserve numerical evidence; future
    samples do not change earlier scoring for declared settings.
  - Adjacent point departures form a consecutive-run pattern with the
    contributing sample positions.
  - Separated point departures remain separate episodes, and positional episode
    intervals use integer coordinates.
guidance:
  - Detection is a numerical departure from the selected expectation, not a
    claim about cause or business impact.
planning:
  story_map:
    backbone: Analyze a local series
    step: Find spikes and drops
    release: Basic CLI anomaly detection
    order: 40
