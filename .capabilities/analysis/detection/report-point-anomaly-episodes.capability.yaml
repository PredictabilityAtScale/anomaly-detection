      - id: isolated-events
        description: Keep separated anomalies from becoming a consecutive-run pattern.
        command: python -m pytest -q
          tests/test_analysis.py::test_isolated_anomalies_do_not_form_second_order_pattern
      - id: positional-episodes
        description: Use integer intervals for position-only episode evidence.
