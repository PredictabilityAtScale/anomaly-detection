  # machine managed agent metadata
  # review all capabilities and save evidence: capabilitykit review
  # review this capability and save evidence: capabilitykit review analysis/evidence/calibrate-departures
  # run deterministic review only: capabilitykit review analysis/evidence/calibrate-departures --deterministic-only
  # ask an agent and save review evidence: capabilitykit review analysis/evidence/calibrate-departures --agent codex --arg exec --handoff stdin
  # validate saved agent output without writing: capabilitykit review-result analysis/evidence/calibrate-departures --input review.json
  # -----------------------------
  depends_on:
