      - tests/test_analysis.py
  verification:
    automated:
      - id: short-history
        description: Keep reference-only evidence for a short series.
        command: python -m pytest -q
          tests/test_analysis.py::test_short_series_returns_reference_evidence
      - id: provisional-evidence
        description: Report provisional scores without point triggers.
        command: python -m pytest -q
          tests/test_analysis.py::test_early_evidence_maturity_and_no_provisional_trigger
      - id: independent-calibration
        description: Check a known residual center, sample scale, and standardized score.
        command: python -m pytest -q tests/test_analysis.py::test_calibration_reference
      - id: constant-reference
        description: Handle zero residual variance without spurious episodes.
        command: python -m pytest -q tests/test_analysis.py::test_constant_and_schema
    manual:
      - Inspect a sample's signal_maturity, calibration_samples,
        standardized_residual, and triggers together before describing a
        statistical departure.
