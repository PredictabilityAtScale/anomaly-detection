title: Understand how much history supports a finding
status: implemented
summary: Sample evidence distinguishes reference-only, provisional, and
  calibrated comparisons before permitting statistical point triggers.
intent: Keep useful early evidence while making its level of support visible.
acceptance:
  - Short series return reference evidence and an insufficient_history status
    instead of inventing calibrated findings.
  - Provisional residual scores can be reported but do not trigger point-anomaly
    episodes.
  - Completed calibration provides a frozen residual center and sample scale for
    later standardized residuals.
  - Evidence records the observed value, expectation, calibration support, and
    numerical criterion responsible for a trigger.
guidance:
  - Evidence strength is not a probability of an incident.
  - Calibration and expectations are separate concerns; each declared regime
    calibrates again.
planning:
  story_map:
    backbone: Analyze a local series
    step: Establish evidence support
    release: Basic CLI anomaly detection
    order: 30
