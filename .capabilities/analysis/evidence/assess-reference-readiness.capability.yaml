title: Know when the expected baseline is weak
status: implemented
summary: Readiness diagnostics report supported, caution, or not_assessed based
  on the training pattern and calibration evidence.
intent: Expose weak expectations even when no anomaly is detected.
acceptance:
  - Repeating seasonal structure with stable calibration can yield supported
    readiness.
  - Unstable declared seasonality or a drifting calibration center yields
    caution without making an otherwise completed run fail.
  - Insufficient calibration support yields not_assessed, including when the run
    otherwise completes.
  - Later evaluation changes do not rewrite the segment's
    training-and-calibration readiness assessment.
guidance:
  - Readiness does not prove real-world effectiveness and is not an automatic
    action-policy gate.
planning:
  story_map:
    backbone: Decide how much to rely on a finding
    step: Assess baseline quality
    release: Evidence and review policy
    order: 20
#
#
agent:
  # -----------------------------
  # machine managed agent metadata
  # review all capabilities and save evidence: capabilitykit review
  # review this capability and save evidence: capabilitykit review analysis/evidence/assess-reference-readiness
  # run deterministic review only: capabilitykit review analysis/evidence/assess-reference-readiness --deterministic-only
  # ask an agent and save review evidence: capabilitykit review analysis/evidence/assess-reference-readiness --agent codex --arg exec --handoff stdin
  # validate saved agent output without writing: capabilitykit review-result analysis/evidence/assess-reference-readiness --input review.json
  # -----------------------------
  depends_on:
    - analysis/evidence/calibrate-departures
  implementation:
    references:
      - src/anomalyzer/readiness.py
      - src/anomalyzer/recipes.py
      - tests/test_readiness.py
  verification:
    automated:
      - id: supported-reference
        description: Support repeated seasonality and preserve readiness under later
          changes.
        command: python -m pytest -q
          tests/test_readiness.py::test_repeating_season_and_trend_support_reference
      - id: weak-season
        description: Warn on unstable seasonality even when no findings occur.
        command: python -m pytest -q
          tests/test_readiness.py::test_unstable_declared_season_warns_without_calling_series_inapplicable
          tests/test_readiness.py::test_documented_random_example_has_no_findings_but_warns_on_reference
      - id: calibration-drift
        description: Warn when residual calibration drifts despite a repeated training
          season.
        command: python -m pytest -q
          tests/test_readiness.py::test_calibration_drift_warns_even_when_training_season_repeats
      - id: not-assessed
        description: Distinguish uncalibrated history and too few calibration samples.
        command: python -m pytest -q
          tests/test_readiness.py::test_readiness_is_not_assessed_without_calibrated_evaluation
          tests/test_readiness.py::test_short_calibration_is_not_assessed_even_when_analysis_completes
    manual:
      - Read readiness reasons alongside findings; a lack of findings alone does
        not establish a trustworthy reference.
