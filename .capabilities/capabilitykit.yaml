schema_version: "0.1"
project:
  name: Anomalyzer
  description: Local time-series analysis with inspectable anomaly and
    relationship evidence.
planning:
  releases:
    - Basic CLI anomaly detection
    - Trend and seasonal analysis
    - Incomplete-period monitoring
    - Related-metric analysis
    - Evidence and review policy
    - Python integration
    - Anomaly detection Skill
    - Read-only MCP server
    - Future - Historical evaluation
    - Future - Calendar and data readiness
    - Future - Business-aware expectations
    - Future - Continuous analysis
    - Future - Cohort investigation
    - Future - Investigation memory
source:
  include:
    - "**/*.capability.yaml"
  exclude:
    - dist/**
validation:
  require_acceptance: true
  require_verification: true
  allow_verification_gaps: true
  require_implementation_references_for_status:
    - implemented
    - verified
output:
  path: .capabilities/dist/capabilities.json
