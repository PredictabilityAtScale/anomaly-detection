      - pyproject.toml
      - src/anomalyzer/_version.py
      - scripts/release.py
      - scripts/publish_release.py
      - scripts/verify_distribution.py
      - scripts/verify_lambda.sh
      - examples/library/guard_smoke.py
      - .github/workflows/ci.yml
      - .github/workflows/release.yml
      - docs/releases/README.md
      - tests/test_release.py
  verification:
    automated:
      - id: release-safety
        description: Reject mismatched tags, altered assets and mutable publication.
        command: python -m pytest -q tests/test_release.py
      - id: installed-artifacts
        description: Install wheel and sdist outside the checkout and invoke public APIs.
        command: python scripts/verify_distribution.py --python 3.12
      - id: release-inventory
        description: Check archive contents, version metadata and SHA-256 inventory.
        command: python scripts/release.py verify
      - id: linux-offline-consumer
        description: Bundle and run with networking disabled in Linux Python 3.12.
        command: bash scripts/verify_lambda.sh
    manual:
      - Follow the release guide and confirm Guard retains domain severity and
        incident ownership; inspect readiness and evidence limits before
        adopting.
  review:
    depth: tested
    source: coding-agent
    gaps:
      - Current-version archive inventory, clean wheel/sdist installations and
        Linux offline execution were not rerun; root dist contains older 0.1.0
        artifacts.
      - Actual published assets and hosted workflow results were not
        independently checked.
    evidence:
