        include SHA-256 checksums, source revision and pinned transitive
        dependencies. Review the cited evidence. If it is correct, save
        agent.review evidence or make the criterion/reference wording more
        explicit.
      - A Linux Python 3.12 build bundles compatible binary dependencies and
        executes the consumer example with networking disabled. Review the cited
