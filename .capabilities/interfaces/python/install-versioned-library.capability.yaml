title: Install a versioned analysis library
status: implemented
summary: Applications can install an identified Anomalyzer distribution and run
  the public analysis API locally with bundled dependencies.
intent: Replace copied source files with a reviewable dependency that can be
  pinned and rolled back independently of application deployments.
acceptance:
  - Wheel and source distributions carry the complete Python package, license,
    public API, CLI and read-only MCP entry points with one authoritative
    version.
  - Clean consumers outside the source checkout can install either distribution
    and exercise contracts, recipes, assessments, relationships, readiness and
    cases.
  - Version tags agree with package metadata and published release assets
    include SHA-256 checksums, source revision and pinned transitive
    dependencies.
  - A Linux Python 3.12 build bundles compatible binary dependencies and
    executes the consumer example with networking disabled.
guidance:
  - Guard owns scheduling, persistence, business severity, incidents and
    notifications.
  - A published package does not establish integration into UsageTap Guard.
planning:
  story_map:
    backbone: Embed analysis in my application
    step: Install a released dependency
    release: Python integration
    order: 20
