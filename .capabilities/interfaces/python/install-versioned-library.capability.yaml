#
agent:
  # -----------------------------
  # machine managed agent metadata
  # review all capabilities and save evidence: capabilitykit review
  # review this capability and save evidence: capabilitykit review interfaces/python/install-versioned-library
  # run deterministic review only: capabilitykit review interfaces/python/install-versioned-library --deterministic-only
  # ask an agent and save review evidence: capabilitykit review interfaces/python/install-versioned-library --agent codex --arg exec --handoff stdin
  # validate saved agent output without writing: capabilitykit review-result interfaces/python/install-versioned-library --input review.json
  # -----------------------------
  depends_on:
    - interfaces/python/analyze-through-public-api
    - interfaces/cli/analyze-files-and-streams
    - interfaces/mcp/connect-read-only-local-server
  implementation:
