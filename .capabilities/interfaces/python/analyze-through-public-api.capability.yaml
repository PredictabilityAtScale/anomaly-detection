title: Embed local analysis in my application
status: implemented
summary: The public Python API accepts series or canonical requests and returns
  the same numerical analysis used by the CLI and MCP compatibility interfaces.
intent: Embed local analysis in an application without changing the meaning of
  the evidence.
acceptance:
  - analyze accepts bare ordered values with separate validated settings and
    dispatches canonical schema 1.0, 1.1 or distribution-v1 requests.
  - analyze_series preserves supplied settings and event-time context for a
    single dataset.
  - analyze_relationships preserves the declared multi-dataset relationship
    semantics.
  - Equivalent requests retain numerical results across Python, CLI, and
    full-result MCP compatibility calls apart from run IDs and runtime.
guidance:
  - All interfaces use local analysis; there is no hosted service or model API
    requirement.
  - Population comparisons also expose compare_distributions and
    monitor_distributions; their statistical assumptions and declared testing
    family remain inspectable.
planning:
  story_map:
    backbone: Embed analysis in my application
    step: Call the public API
    release: Python integration
    order: 10
