title: Let an agent inspect the evidence behind a finding
status: implemented
summary: Agents can analyze a request, page through its findings, and retrieve
  supporting samples, assessments, readiness, and relationship lineage.
intent: Keep the initial agent response compact while making the supporting
  evidence inspectable.
acceptance:
  - The analyze tool returns a compact headline, finding preview, and run ID for
    subsequent evidence requests.
  - list_findings pages through cases, candidates, episodes, patterns, and
    data-quality findings.
  - get_evidence exposes the selected finding's numerical support and
    relationship source lineage.
  - Unavailable latest evidence and non-triggering early candidates remain
    visible, while large pattern sample sets are paginated.
guidance:
  - Run results are retained only in the bounded server-session cache; missing
    or evicted run IDs require reanalysis.
  - Cases, episodes, and residual patterns may overlap.
planning:
  story_map:
    backbone: Give an agent access to local evidence
    step: Drill into findings and evidence
    release: Read-only MCP server
    order: 20
