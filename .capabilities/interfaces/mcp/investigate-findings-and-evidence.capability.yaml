  # ask an agent and save review evidence: capabilitykit review interfaces/mcp/investigate-findings-and-evidence --agent codex --arg exec --handoff stdin
  # validate saved agent output without writing: capabilitykit review-result interfaces/mcp/investigate-findings-and-evidence --input review.json
