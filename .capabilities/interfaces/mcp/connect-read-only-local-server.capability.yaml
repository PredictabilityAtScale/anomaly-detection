  # review this capability and save evidence: capabilitykit review interfaces/mcp/connect-read-only-local-server
  # run deterministic review only: capabilitykit review interfaces/mcp/connect-read-only-local-server --deterministic-only
  # ask an agent and save review evidence: capabilitykit review interfaces/mcp/connect-read-only-local-server --agent codex --arg exec --handoff stdin
  # validate saved agent output without writing: capabilitykit review-result interfaces/mcp/connect-read-only-local-server --input review.json
