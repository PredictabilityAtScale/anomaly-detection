title: Give an agent read-only access to local analysis
status: implemented
summary: The local stdio MCP server advertises three read-only investigation
  tools with schemas and interpretation guidance.
intent: Allow agent clients to discover and call the analysis tools using a
  clear local protocol contract.
acceptance:
  - Tool discovery advertises analyze, list_findings, and get_evidence as
    read-only with input and output schemas.
  - Legacy initialization and modern stateless discovery return supported
    protocol metadata and interpretation guidance.
  - Analysis tool calls return structured content together with compact text.
  - Invalid tool input and unknown session run IDs return structured errors
    rather than fabricated results.
guidance:
  - Compatibility tool names remain callable but are not advertised.
  - Legacy clients receive isError tool results; modern clients receive JSON-RPC
    invalid-input errors.
  - The server provides analysis and evidence inspection; the caller owns
    monitoring and operational workflows.
planning:
  story_map:
    backbone: Give an agent access to local evidence
    step: Connect a local server
    release: Read-only MCP server
    order: 10
