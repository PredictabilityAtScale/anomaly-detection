          tests/test_skill_chart.py::test_quick_chart_marks_reviewed_resets
      - id: unsupported-scope
        description: Reject a multi-dataset result rather than mixing units.
        command: python -m pytest -q
          tests/test_skill_chart.py::test_quick_chart_rejects_multiple_datasets
      - id: output-protection
        description: Require an explicit overwrite for existing charts.
        command: python -m pytest -q
