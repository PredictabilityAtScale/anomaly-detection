title: See the evidence in a chart when I ask for one
status: implemented
summary: The anomaly-detection Skill offers an explicitly requested quick chart
  or a detailed figure specification after structured analysis completes.
intent: Make findings easier to inspect visually while preserving their evidence
  meaning and the user's requested level of detail.
acceptance:
  - The Skill defaults to text and requires an explicit visualization request;
    quick charts and publication-quality figures have separate instructions.
  - The dependency-free quick chart fallback renders one resolved dataset's
    observed values and available expectations, marks only triggered evidence,
    and labels training, calibration, units, and reviewed reset boundaries.
  - The fallback rejects unsupported multi-dataset results and protects an
    existing output file unless overwrite is explicitly requested.
  - Detailed figure instructions preserve source indices,
    provisional-versus-calibrated evidence, pattern detection timing, and
    incomplete or failed run status, without presenting scores as probabilities
    or flags as proven causes.
guidance:
  - Native chart rendering and interactive figure features depend on the agent
    host; the checked-in fallback produces a static SVG for a single dataset.
  - A chart explains structured analysis; it does not replace the detector
    result.
planning:
  story_map:
    backbone: Ask an agent to investigate a change
    step: Inspect a requested chart
    release: Anomaly detection Skill
    order: 20
