    automated:
      - id: observed-evidence
        description: Render real observed and expected data and only actual point triggers.
        command: python -m pytest -q
          tests/test_skill_chart.py::test_quick_chart_preserves_real_point_evidence
      - id: maturity-and-resets
        description: Keep provisional evidence non-triggering and label reviewed regimes.
        command: python -m pytest -q
          tests/test_skill_chart.py::test_provisional_scores_are_not_charted_as_triggers
          tests/test_skill_chart.py::test_quick_chart_marks_reviewed_resets
      - id: unsupported-scope
        description: Reject a multi-dataset result rather than mixing units.
        command: python -m pytest -q
          tests/test_skill_chart.py::test_quick_chart_rejects_multiple_datasets
      - id: output-protection
        description: Require an explicit overwrite for existing charts.
        command: python -m pytest -q
          tests/test_skill_chart.py::test_chart_cli_requires_explicit_overwrite
    manual:
      - Inspect a spike fallback chart and the detailed figure instructions;
        verify that axes, initialization context, trigger markers, and
        interpretation limits are clear, and that the Skill requests a chart
