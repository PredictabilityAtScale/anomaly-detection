title: Ask an agent to explain unusual changes in my metrics
status: implemented
summary: The reusable anomaly-detection Skill guides an agent through local
  Anomalyzer analysis and a concise explanation grounded in structured evidence.
intent: Make the analysis usable through an agent while keeping data handling
  and interpretation limits explicit.
acceptance:
  - The Skill directs analysis through the installed Anomalyzer CLI, with
    executable fallback paths and structured JSON output, rather than a newly
    invented detector.
  - The Skill instructs callers to preserve missing data, select one entity and
    unit, and explicitly declare compatible sources for related-metric analysis.
  - The default response instructions lead with changes and
    observed-versus-expected values, then explain readiness, evidence maturity,
    overlapping findings, and material limitations without inventing confidence
    percentages or causes.
  - The Skill describes MCP analyze, list_findings, and get_evidence as an
    optional evidence workflow and makes session lifetime, read-only access, and
    caller-owned notification and action delivery explicit.
guidance:
  - This contract covers the supplied instructions and demonstrated analysis
    workflow; it does not guarantee that every agent host follows the
    instructions.
  - Synthetic examples demonstrate mechanics, not real-world detection accuracy.
planning:
  story_map:
    backbone: Ask an agent to investigate a change
    step: Get an evidence-grounded explanation
    release: Anomaly detection Skill
    order: 10
#
#
agent:
  # -----------------------------
  # machine managed agent metadata
  # review all capabilities and save evidence: capabilitykit review
  # review this capability and save evidence: capabilitykit review interfaces/skill/guide-anomaly-investigation
  # run deterministic review only: capabilitykit review interfaces/skill/guide-anomaly-investigation --deterministic-only
  # ask an agent and save review evidence: capabilitykit review interfaces/skill/guide-anomaly-investigation --agent codex --arg exec --handoff stdin
  # validate saved agent output without writing: capabilitykit review-result interfaces/skill/guide-anomaly-investigation --input review.json
  # -----------------------------
