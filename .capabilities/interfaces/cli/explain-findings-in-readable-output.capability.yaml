title: Understand findings in a readable summary
status: implemented
summary: Readable CLI output distinguishes point episodes, pattern findings,
  cases, explicit rule violations, and reference readiness.
intent: Let a person understand what changed and which evidence supports it
  without parsing the full JSON result.
acceptance:
  - Point-anomaly episode counts and residual-pattern findings are labeled
    separately.
  - Relationship cases identify entity scope, observed and expected values,
    declared units, and investigation questions.
  - Explicit numerical rules are named with their boundaries instead of
    appearing as statistical anomaly claims.
  - Readiness status remains visible, including when it was not assessed.
guidance:
  - Readable summaries should retain the evidence's claim limits and allow
    drilldown into JSON.
planning:
  story_map:
    backbone: Analyze a local series
    step: Read the findings
    release: Basic CLI anomaly detection
    order: 60
