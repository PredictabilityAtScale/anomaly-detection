  # ask an agent and save review evidence: capabilitykit review interfaces/cli/explain-findings-in-readable-output --agent codex --arg exec --handoff stdin
  # validate saved agent output without writing: capabilitykit review-result interfaces/cli/explain-findings-in-readable-output --input review.json
