        command: python -m pytest -q
          tests/test_cli.py::test_schema_11_relationship_request_through_cli
      - id: explicit-rule
        description: Describe the unit-cost rule boundary and unassessed readiness.
        command: python -m pytest -q
          tests/test_cli.py::test_schema_11_readable_case_distinguishes_explicit_rule
    manual:
      - Read the conversion and unit-cost example output and confirm the
