title: Analyze local files from the command line
status: implemented
summary: The CLI analyzes CSV, JSON requests, and bare JSON values from files or
  stdin, with configurable settings and protected output files.
intent: Make local analysis usable in scripts and ad hoc investigation.
acceptance:
  - The methods command lists supported analysis recipes and residual detectors.
  - Equivalent file and stdin JSON inputs produce equivalent request
    fingerprints and analysis semantics.
  - CSV supports positional or timestamped selected values, treats empty cells
    as missing, and rejects varying unmapped entity columns.
  - Settings resolve in embedded-request, settings-file, then CLI-flag
    precedence; bare JSON values can use CLI configuration.
  - Output files require explicit overwrite permission, and invalid input is
    distinguished from execution failure by exit status.
guidance:
  - CSV callers must select one entity and unit before analysis.
  - Exit 0 includes completed analysis with anomalies, insufficient history, or
    inapplicability; exit 2 means invalid input, and exit 1 means execution
    failure or partial execution.
planning:
  story_map:
    backbone: Use analysis in my workflow
    step: Choose a way to use analysis
    release: Understand a change
    order: 70
