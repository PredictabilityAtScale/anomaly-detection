title: Spot early changes with a short history
status: implemented
summary: Short histories yield observations, changes, and departure candidates
  with explicit comparison populations and limits.
intent: Provide an inspectable lead for investigation without overstating
  statistical support.
acceptance:
  - The first observation records a value, the second records a change, and
    later departures from the prior range can be candidates.
  - Descriptive assessments use preceding observations and remain unchanged when
    future samples are appended.
  - Missing values break the comparison history, and zero previous values do not
    create relative-change evidence.
  - Early candidates remain non-triggering and ineligible for action even under
    a permissive policy.
guidance:
  - An early candidate does not establish an anomaly, stable baseline, cause, or
    incident.
planning:
  story_map:
    backbone: Decide how much to rely on a finding
    step: Inspect early evidence
    release: Evidence and review policy
    order: 10
#
#
agent:
  # -----------------------------
  # machine managed agent metadata
  # review all capabilities and save evidence: capabilitykit review
  # review this capability and save evidence: capabilitykit review investigation/assessments/describe-early-changes
  # run deterministic review only: capabilitykit review investigation/assessments/describe-early-changes --deterministic-only
  # ask an agent and save review evidence: capabilitykit review investigation/assessments/describe-early-changes --agent codex --arg exec --handoff stdin
  # validate saved agent output without writing: capabilitykit review-result investigation/assessments/describe-early-changes --input review.json
  # -----------------------------
  depends_on:
    - data/inputs/accept-analysis-requests
  implementation:
    references:
      - src/anomalyzer/early.py
      - src/anomalyzer/orchestrator.py
      - tests/test_agentic.py
      - tests/test_mcp.py
      - tests/test_capability_behaviors.py
  verification:
    automated:
      - id: prefix-invariant-facts
        description: Describe short history causally without creating cases.
        command: python -m pytest -q
          tests/test_agentic.py::test_short_history_assessments_are_useful_and_prefix_invariant
      - id: comparison-boundaries
        description: Reset comparisons at missing observations and avoid dividing by zero.
        command: python -m pytest -q
          tests/test_capability_behaviors.py::test_relative_rule_does_not_compare_across_zero_or_missing_values
      - id: candidate-eligibility
        description: Keep candidates ineligible for action and notifications under
          permissive policy.
        command: python -m pytest -q
          tests/test_capability_behaviors.py::test_policy_keeps_early_candidates_ineligible
      - id: agent-visibility
        description: Expose a short-history candidate and its claim limits without a case.
        command: python -m pytest -q
          tests/test_mcp.py::test_short_history_candidate_is_visible_without_a_case
    manual:
      - Inspect a candidate's comparison population, maturity, established
        claim, and not_established text before describing it.
