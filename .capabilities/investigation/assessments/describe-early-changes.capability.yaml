  # review all capabilities and save evidence: capabilitykit review
  # review this capability and save evidence: capabilitykit review investigation/assessments/describe-early-changes
  # run deterministic review only: capabilitykit review investigation/assessments/describe-early-changes --deterministic-only
  # ask an agent and save review evidence: capabilitykit review investigation/assessments/describe-early-changes --agent codex --arg exec --handoff stdin
  # validate saved agent output without writing: capabilitykit review-result investigation/assessments/describe-early-changes --input review.json
  # -----------------------------
