      - tests/test_agentic.py
      - tests/test_mcp.py
      - tests/test_capability_behaviors.py
  verification:
    automated:
      - id: prefix-invariant-facts
        description: Describe short history causally without creating cases.
        command: python -m pytest -q
          tests/test_agentic.py::test_short_history_assessments_are_useful_and_prefix_invariant
      - id: comparison-boundaries
        description: Reset comparisons at missing observations and avoid dividing by zero.
        command: python -m pytest -q
          tests/test_capability_behaviors.py::test_relative_rule_does_not_compare_across_zero_or_missing_values
      - id: candidate-eligibility
        description: Keep candidates ineligible for action and notifications under
          permissive policy.
        command: python -m pytest -q
          tests/test_capability_behaviors.py::test_policy_keeps_early_candidates_ineligible
      - id: agent-visibility
        description: Expose a short-history candidate and its claim limits without a case.
        command: python -m pytest -q
          tests/test_mcp.py::test_short_history_candidate_is_visible_without_a_case
    manual:
      - Inspect a candidate's comparison population, maturity, established
        claim, and not_established text before describing it.
