title: Describe early changes before calibration
status: implemented
summary: Short histories yield observations, changes, and departure candidates
  with explicit comparison populations and limits.
intent: Provide an inspectable lead for investigation without overstating
  statistical support.
acceptance:
  - The first observation records a value, the second records a change, and
    later departures from the prior range can be candidates.
  - Descriptive assessments use preceding observations and remain unchanged when
    future samples are appended.
  - Missing values break the comparison history, and zero previous values do not
    create relative-change evidence.
  - Early candidates remain non-triggering and ineligible for action even under
    a permissive policy.
guidance:
  - An early candidate does not establish an anomaly, stable baseline, cause, or
    incident.
