        criterion evidence in the current session after the outcome-title and
        deliverable-lane refactor.
      - ".venv/Scripts/python.exe -m pytest -q: 154 passed in 13.98s;
        .capabilities/reviews/deliverable-lanes/verification.json."
      - Executed and inspected CLI examples, time preparation, policy replay,
        open-day monitoring, and MCP conversion evidence drilldown;
        .capabilities/reviews/deliverable-lanes/manual-checks.json.
    intent_summary: Qualifying assessments are grouped by event time and entity into
      cases with explanations, evidence references, and numerical severity.
