  # machine managed agent metadata
  # review all capabilities and save evidence: capabilitykit review
  # review this capability and save evidence: capabilitykit review investigation/cases/group-related-evidence
  # run deterministic review only: capabilitykit review investigation/cases/group-related-evidence --deterministic-only
  # ask an agent and save review evidence: capabilitykit review investigation/cases/group-related-evidence --agent codex --arg exec --handoff stdin
  # validate saved agent output without writing: capabilitykit review-result investigation/cases/group-related-evidence --input review.json
  # -----------------------------
  depends_on:
    - investigation/assessments/describe-early-changes
