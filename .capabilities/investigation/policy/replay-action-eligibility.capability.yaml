title: Change action eligibility without rerunning analysis
status: implemented
summary: Callers can apply a different explicit action policy to existing
  assessments and cases without recomputing numerical analysis.
intent: Separate an observed criterion from a caller's decision to make it
  eligible for further action.
acceptance:
  - Default policy leaves action and notification eligibility disabled.
  - Explicit-rule and calibrated-departure eligibility are controlled
    independently.
  - Notification eligibility can be allowed for a met criterion without action
    eligibility, while early candidates remain ineligible.
  - Replaying policy preserves numerical evidence and stable case IDs, records
    changed case revisions, and leaves the original result unchanged.
guidance:
  - Eligibility does not send notifications, execute actions, check readiness,
    or confer authority to act.
  - Monitoring schedules, delivery, reviewed incident state, and deduplication
    belong to the caller.
planning:
  story_map:
    backbone: Investigate a change
    step: Apply my review policy
    release: Understand a change
    order: 60
