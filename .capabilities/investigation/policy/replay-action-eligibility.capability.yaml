      - id: independent-notifications
        description: Replay notification and action choices without changing numerical
          evidence or the original result.
        command: python -m pytest -q
          tests/test_capability_behaviors.py::test_policy_replay_separates_action_from_notification
      - id: calibrated-choice
        description: Enable calibrated departures only with the corresponding policy choice.
        command: python -m pytest -q
          tests/test_capability_behaviors.py::test_policy_replay_enables_calibrated_departures_only_when_requested
      - id: nontriggering-candidates
        description: Keep descriptive candidates ineligible even under a permissive policy.
        command: python -m pytest -q
          tests/test_capability_behaviors.py::test_policy_keeps_early_candidates_ineligible
    manual:
