        status: covered
        evidence:
          - src/anomalyzer/early.py:29
          - src/anomalyzer/early.py:53
          - tests/test_capability_behaviors.py:87
        notes: Zero/missing predecessors suppress relative comparisons, and missing
          values reset comparison history.
      - criterion: Violations identify the exact declared rule and remain
          action-ineligible unless policy explicitly permits them.
        status: covered
        evidence:
          - src/anomalyzer/early.py:34
          - src/anomalyzer/early.py:121
          - tests/test_agentic.py:49
          - tests/test_cli.py:134
        notes: Violation records retain rule ID/kind/bounds; default eligibility is
