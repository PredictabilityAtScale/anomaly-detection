title: Find values that break my stated limits
status: implemented
summary: Acceptable ranges and maximum absolute or relative changes identify
  explicit criterion violations, including before calibration.
intent: Let callers check clear numerical constraints without presenting them as
  learned anomaly thresholds.
acceptance:
  - Values outside an inclusive acceptable range are violations, while values on
    the boundary are accepted.
  - Absolute and relative changes must exceed their declared maximum to violate
    a rule.
  - Relative-change checks require a nonzero previous value and do not bridge
    missing observations.
  - Violations identify the exact declared rule and remain action-ineligible
    unless policy explicitly permits them.
guidance:
  - An exact rule crossing does not establish cause, an incident, or business
    impact.
planning:
  story_map:
    backbone: Decide how much to rely on a finding
    step: Apply my stated limits
    release: Evidence and review policy
    order: 30
#
#
agent:
  # -----------------------------
  # machine managed agent metadata
  # review all capabilities and save evidence: capabilitykit review
  # review this capability and save evidence: capabilitykit review investigation/rules/check-declared-numerical-rules
  # run deterministic review only: capabilitykit review investigation/rules/check-declared-numerical-rules --deterministic-only
  # ask an agent and save review evidence: capabilitykit review investigation/rules/check-declared-numerical-rules --agent codex --arg exec --handoff stdin
  # validate saved agent output without writing: capabilitykit review-result investigation/rules/check-declared-numerical-rules --input review.json
  # -----------------------------
  depends_on:
    - investigation/assessments/describe-early-changes
  implementation:
    references:
      - src/anomalyzer/early.py
      - src/anomalyzer/contracts.py
      - tests/test_agentic.py
      - tests/test_cli.py
      - tests/test_capability_behaviors.py
  verification:
    automated:
      - id: rule-boundaries
        description: Check inclusive range boundaries and strict absolute/relative
          change thresholds.
        command: python -m pytest -q
          tests/test_capability_behaviors.py::test_explicit_rules_respect_boundaries
      - id: relative-availability
        description: Avoid relative violations across zero or missing values.
        command: python -m pytest -q
          tests/test_capability_behaviors.py::test_relative_rule_does_not_compare_across_zero_or_missing_values
      - id: explicit-not-actionable
        description: Create evidence and a case for an exact rule crossing without
          enabling action by default.
        command: python -m pytest -q
          tests/test_agentic.py::test_explicit_rule_is_exact_but_not_actionable_without_policy
      - id: readable-rule
        description: Identify the exact unit-cost range rule in CLI output.
        command: python -m pytest -q
          tests/test_cli.py::test_schema_11_readable_case_distinguishes_explicit_rule
    manual:
      - Read the unit-cost example's crossed rule and confirm its text
        distinguishes the declared bound from statistical detection.
  review:
    depth: verified
    source: coding-agent
    evidence:
      - Primary Codex agent re-inspected declared implementation references and
        criterion evidence in the current session after the outcome-title and
        deliverable-lane refactor.
      - ".venv/Scripts/python.exe -m pytest -q: 154 passed in 13.98s;
        .capabilities/reviews/deliverable-lanes/verification.json."
      - Executed and inspected CLI examples, time preparation, policy replay,
        open-day monitoring, and MCP conversion evidence drilldown;
        .capabilities/reviews/deliverable-lanes/manual-checks.json.
    intent_summary: Acceptable ranges and maximum absolute or relative changes
      identify explicit criterion violations, including before calibration.
    criteria:
      - criterion: Values outside an inclusive acceptable range are violations, while
          values on the boundary are accepted.
        status: covered
        evidence:
          - src/anomalyzer/early.py:22
          - src/anomalyzer/contracts.py:209
          - tests/test_capability_behaviors.py:74
        notes: Boundary values 10 and 20 are accepted; 9 and 21 violate the declared
          range.
      - criterion: Absolute and relative changes must exceed their declared maximum to
          violate a rule.
        status: covered
        evidence:
          - src/anomalyzer/early.py:25
          - tests/test_capability_behaviors.py:74
        notes: Parameterized tests distinguish equality to the threshold from strict
